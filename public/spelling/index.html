};

/* Tile round shared by "Điền chữ thiếu" and "Xếp chữ" */
function tileRound(g, w, positions, bankLetters, opts, done) {
  const chars = [...w.w], pos = positions.slice().sort((a, b) => a - b), posSet = new Set(pos);
  const bank = bankLetters.map((ch, id) => ({ ch, id, used: false }));
  let fill = {}, tries = 0, hinted = false, over = false, mark = null;
  const wordEl = $("#g-word"), bankEl = $("#g-bank");
  const same = (p, id) => bank[id].ch.toLowerCase() === chars[p].toLowerCase();
  const draw = () => {
    const firstEmpty = pos.find(p => fill[p] == null);
    wordEl.innerHTML = tileWrap(chars, (ch, k) => {
      if (!isL(ch)) return `<span class="tile fixed">${ch === " " ? "" : esc(ch)}</span>`;
      if (!posSet.has(k)) return `<span class="tile">${esc(ch)}</span>`;
      if (over === "reveal") return `<span class="tile good">${esc(ch)}</span>`;
      const id = fill[k], m = mark && mark[k] ? " " + mark[k] : "";
      if (id != null) return `<button type="button" class="tile${m}" data-slot="${k}" aria-label="Bỏ chữ ${esc(bank[id].ch)} ra">${esc(bank[id].ch)}</button>`;
      return `<span class="tile slot${k === firstEmpty ? " cur" : ""}"></span>`;
    });
    bankEl.innerHTML = over ? "" : bank.map(b => `<button type="button" class="tile${b.used ? " used" : ""}" data-bank="${b.id}" aria-label="Chữ ${esc(b.ch)}" ${b.used ? "disabled" : ""}>${esc(b.ch)}</button>`).join("");
  };
  const attempt = () => chars.map((ch, k) => posSet.has(k) ? (fill[k] != null ? bank[fill[k]].ch : "_") : ch).join("");
  const check = () => {
    if (over) return;
    if (pos.every(p => same(p, fill[p]))) {
      over = true; mark = {}; pos.forEach(p => { mark[p] = "good"; }); draw();
      SFX.play("ok"); fb("good", tries || hinted ? "Đúng rồi!" : pick(PRAISE));
      if (TTS.ok) TTS.say(w.w);
      done(tries || hinted ? 0.5 : 1, "");
      return;
    }
    tries++; SFX.play("bad");
    mark = {}; pos.forEach(p => { mark[p] = same(p, fill[p]) ? "good" : "bad"; });
    draw(); shake(wordEl);
    if (tries >= opts.maxTries) {
      const typed = attempt(); over = true;
      fb("bad", "Xem cách viết đúng nhé");
      g.later(() => { over = "reveal"; mark = null; draw(); if (TTS.ok) TTS.say(w.w); }, 800);
      done(0, typed);
    } else {
      fb("bad", "Chữ màu đỏ chưa đúng chỗ. Thử lại nhé!");
      g.later(() => { pos.forEach(p => { if (mark && mark[p] === "bad") { bank[fill[p]].used = false; delete fill[p]; } }); mark = null; draw(); }, 900);
    }
  };
  const place = id => {
    if (over || mark) return;
    const b = bank[id]; if (!b || b.used) return;
    const p = pos.find(q => fill[q] == null); if (p == null) return;
    fill[p] = id; b.used = true; SFX.play("tap"); draw();
    if (pos.every(q => fill[q] != null)) g.later(check, 200);
  };
  const unplace = p => {
    if (over || mark) return;
    const id = fill[p]; if (id == null) return;
    bank[id].used = false; delete fill[p]; draw();
  };
  const hint = () => {
    if (over || mark) return;
    const p = pos.find(q => fill[q] == null || !same(q, fill[q])); if (p == null) return;
    hinted = true;
    pos.filter(q => q >= p && fill[q] != null).forEach(q => { bank[fill[q]].used = false; delete fill[q]; });
    const b = bank.find(x => !x.used && x.ch.toLowerCase() === chars[p].toLowerCase());
    if (b) { fill[p] = b.id; b.used = true; }
    draw();
    if (pos.every(q => fill[q] != null)) g.later(check, 200);
  };
  g.stage.onclick = e => {
    const b = e.target.closest("[data-bank]"); if (b) return place(+b.dataset.bank);
    const s = e.target.closest("[data-slot]"); if (s) return unplace(+s.dataset.slot);
    if (e.target.closest("#g-hint")) hint();
  };
  g.keyFn = e => {
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (/^[a-z]$/.test(k)) { const b = bank.find(x => !x.used && x.ch.toLowerCase() === k); if (b) { e.preventDefault(); place(b.id); } }
    else if (k === "Backspace") { const filled = pos.filter(q => fill[q] != null); if (filled.length) { e.preventDefault(); unplace(filled[filled.length - 1]); } }

}
function tileStage(g, w, i, withHint) {
  g.cur = w;

  g.stage.innerHTML = `<div style="display:grid;gap:12px;justify-items:center">${clueHtml(w)}${speakHtml(w, false)}</div>

}
function afterTile(g, i, next) {
  return (credit, typed) => {
    g.record(g.words[i], credit, typed);
    if (credit > 0) g.later(next, 1200);
    else g.later(() => { $("#g-extra").innerHTML = `<button class="btn primary" type="button" id="g-next">${nextLabel(g, i)}</button>`; $("#g-next").onclick = next; }, 800);

      }
    };
    const next = () => { i++; show(); };
    g.stage.onclick = e => {
      if (G !== g) return;

      const s = e.target.closest("[data-speak]"); if (s) { clearTimeout(autoT); if (TTS.ok) TTS.say(s.dataset.speak); return; }

      if (phase === "ask" && (e.key === "1" || e.key === "ArrowLeft")) { e.preventDefault(); answer("inf"); }

};

GAMES.search = {
  id: "search", name: "Tìm từ", en: "Word Search", min: 3, count: 8,
  filter: w => { const n = onlyL(w.w).length; return n >= 2 && n <= 10; },
  desc: "Tìm các từ ẩn trong bảng chữ. Kéo, hoặc chạm chữ đầu rồi chữ cuối.", need: "Cần ít nhất 3 từ dài 2–10 chữ cái.",
  art: () => '<div style="display:grid;grid-template-columns:repeat(4,15px);grid-auto-rows:13px;gap:2px;font-family:var(--font-word);font-weight:700;font-size:.66rem;line-height:13px;text-align:center">' +
    "DOGXAEIRKSUNPLMC".split("").map((c, k) => `<span style="border-radius:3px;background:${[0, 5, 10].includes(k) ? "var(--accent)" : "var(--sheet)"};color:${[0, 5, 10].includes(k) ? "var(--on-accent)" : "var(--ink)"}">${c}</span>`).join("") + "</div>",
  start(g) {
    const list = g.words.map(w => ({ w, s: onlyL(w.w).toUpperCase() }));
    const longest = Math.max(...list.map(x => x.s.length)), total = list.reduce((a, x) => a + x.s.length, 0);
    let N = clamp(Math.max(longest + 1, Math.ceil(Math.sqrt(total * 2.1))), 7, 11);
    const DIRS = [[0, 1], [1, 0], [1, 1]];
    let grid = [], placed = [];
    for (let attempt = 0; attempt < 30; attempt++) {
      if (attempt === 12 && N < 12) N++;
      grid = Array.from({ length: N }, () => Array(N).fill(""));
      placed = [];
      for (const it of list.slice().sort((a, b) => b.s.length - a.s.length)) {
        const L = it.s.length;
        for (let t = 0; t < 160; t++) {
          const [dr, dc] = DIRS[rand(DIRS.length)];
          const maxR = dr ? N - L : N - 1, maxC = dc ? N - L : N - 1;
          if (maxR < 0 || maxC < 0) continue;
          const r0 = rand(maxR + 1), c0 = rand(maxC + 1);
          let fits = true;
          for (let k = 0; k < L; k++) { const ch = grid[r0 + dr * k][c0 + dc * k]; if (ch && ch !== it.s[k]) { fits = false; break; } }
          if (!fits) continue;
          const cells = [];
          for (let k = 0; k < L; k++) { grid[r0 + dr * k][c0 + dc * k] = it.s[k]; cells.push((r0 + dr * k) * N + c0 + dc * k); }
          placed.push(Object.assign({}, it, { cells, found: false, missed: false }));
          break;
        }
      }
      if (placed.length === list.length || (attempt >= 20 && placed.length >= 3)) break;
    }
    const FILL = "AAABCDEEEEFGHIIIKLLMNNOOOPRRSSTTTUWY";
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!grid[r][c]) grid[r][c] = FILL[rand(FILL.length)];
    const allVi = placed.every(p => p.w.vi);
    let hard = false, over = false;
    const foundCells = new Set(), revealCells = new Set();
    g.stage.innerHTML = `<div class="ws-wrap">
      ${allVi ? '<label class="toggle" style="margin:0"><input type="checkbox" id="ws-vi"> Khó hơn: chỉ hiện nghĩa tiếng Việt</label>' : ""}
      <div class="wslist" id="ws-list"></div>
      <div class="wsgrid" id="ws-grid" style="--n:${N}" aria-label="Bảng chữ cái ${N} x ${N}">${grid.flat().map((ch, k) => `<div class="c" data-c="${k}">${ch}</div>`).join("")}</div>
      <div class="fb" id="g-fb" aria-live="polite"></div>
      <div class="row" id="ws-acts" style="justify-content:center"><button class="btn sm ghost" type="button" id="ws-give">Chịu, xem đáp án</button></div>
    </div>`;
    const gridEl = $("#ws-grid");
    const drawList = () => {
      $("#ws-list").innerHTML = placed.map(p => `<span class="${p.found ? "done" : p.missed ? "miss" : ""}">${esc(hard && !p.found && !p.missed ? ((p.w.e ? p.w.e + " " : "") + p.w.vi) : p.w.w)}</span>`).join("");
      const f = placed.filter(p => p.found).length;
      g.hud(`${f}/${placed.length} từ`); g.progress(f, placed.length);
    };
    let start = null, sel = [], dragging = false, moved = false;
    const paint = () => {
      $$(".c", gridEl).forEach(el => {
        const k = +el.dataset.c;
        el.className = "c" + (sel.includes(k) ? " sel" : foundCells.has(k) ? " found" : revealCells.has(k) ? " reveal" : "") + (start === k && !dragging && !sel.length ? " start" : "");
      });
    };
    const cellAt = (x, y) => { const el = document.elementFromPoint(x, y); const c = el && el.closest ? el.closest("[data-c]") : null; return c && gridEl.contains(c) ? +c.dataset.c : null; };
    const line = (a, b) => {
      const r1 = Math.floor(a / N), c1 = a % N, r2 = Math.floor(b / N), c2 = b % N;
      if (!(r1 === r2 || c1 === c2 || Math.abs(r2 - r1) === Math.abs(c2 - c1))) return null;
      const dr = Math.sign(r2 - r1), dc = Math.sign(c2 - c1), len = Math.max(Math.abs(r2 - r1), Math.abs(c2 - c1)), out = [];
      for (let k = 0; k <= len; k++) out.push((r1 + dr * k) * N + c1 + dc * k);
      return out;
    };
    const finishSearch = () => {
      placed.forEach(p => g.record(p.w, p.found ? 1 : 0, "", false));
      const f = placed.filter(p => p.found).length;
      g.finish({ score: Math.round(20 * f / placed.length) / 2, note: `Tìm được ${f}/${placed.length} từ` });
    };
    const trySel = () => {
      if (sel.length < 2) return;
      const s = sel.map(k => grid[Math.floor(k / N)][k % N]).join(""), rev = [...s].reverse().join("");
      const hit = placed.find(p => !p.found && !p.missed && (p.s === s || p.s === rev));
      if (hit) {
        hit.found = true; sel.forEach(k => foundCells.add(k));
        SFX.play("ok"); fb("good", pick(PRAISE) + " " + hit.w.w); if (TTS.ok) TTS.say(hit.w.w);
        drawList();
        if (placed.every(p => p.found || p.missed)) { over = true; g.later(finishSearch, 1300); }
      } else { SFX.play("bad"); fb("bad", "Chưa phải từ cần tìm"); }
    };
    gridEl.addEventListener("pointerdown", e => {
      if (over) return;
      const k = cellAt(e.clientX, e.clientY); if (k == null) return;
      e.preventDefault();
      if (start != null && !dragging) {
        if (k === start) { start = null; paint(); return; }
        const l = line(start, k); start = null;
        if (l) { sel = l; paint(); trySel(); }
        sel = []; g.later(paint, 160); return;
      }
      try { gridEl.setPointerCapture(e.pointerId); } catch {}
      dragging = true; moved = false; start = k; sel = [k]; paint();
    });
    gridEl.addEventListener("pointermove", e => {
      if (!dragging) return;
      const k = cellAt(e.clientX, e.clientY); if (k == null) return;
      const l = line(start, k);
      if (l) { if (l.length > 1) moved = true; sel = l; paint(); }
    });
    const up = () => {
      if (!dragging) return;
      dragging = false;
      if (moved && sel.length > 1) { trySel(); start = null; }
      sel = []; paint();
    };
    gridEl.addEventListener("pointerup", up);
    gridEl.addEventListener("pointercancel", () => { dragging = false; start = null; sel = []; paint(); });
    g.stage.onclick = e => {
      if (e.target.closest("#ws-give") && !over) {
        over = true;
        placed.forEach(p => { if (!p.found) { p.missed = true; p.cells.forEach(k => revealCells.add(k)); } });
        drawList(); paint(); fb("bad", "Các từ màu đỏ là đáp án.");
        $("#ws-acts").innerHTML = '<button class="btn primary" type="button" id="ws-end">Xem điểm</button>';
      } else if (e.target.closest("#ws-end")) finishSearch();
    };
    g.stage.addEventListener("change", e => { if (e.target.id === "ws-vi") { hard = e.target.checked; drawList(); } });
    drawList(); paint();
  },
};

      const area = $("#r-area"), form = $("#g-form");
      let inp = $("#g-in");
      const queue = Array.from({ length: Math.max(12, g.words.length) }, (_, k) => g.words[k % g.words.length]).slice(0, 12);
      let drops = [], spawned = 0, caught = 0, lives = 3, last = performance.now(), wait = 0, raf = 0, ended = false;
      g.cleanups.push(() => cancelAnimationFrame(raf));
      try { inp.focus({ preventScroll: true }); area.scrollIntoView({ block: "start", behavior: "smooth" }); } catch {}
      const spawn = () => {
        const w = queue[spawned++];
        const el = document.createElement("div");
        el.className = "drop" + (hard ? " m" : "");
        el.textContent = hard ? ((w.e ? w.e + " " : "") + w.vi) : w.w;
        area.appendChild(el);
        const x = 6 + Math.random() * Math.max(0, area.clientWidth - el.offsetWidth - 12);
        const fall = Math.max(5, 10.5 - spawned * 0.45);
        const d = { w, el, y: -44, v: (area.clientHeight + 44) / fall };
        el.style.setProperty("--x", x + "px"); el.style.setProperty("--y", d.y + "px");
        drops.push(d);

      const status = () => {
        $("#r-lives").textContent = "♥".repeat(lives) + "♡".repeat(3 - lives);
        $("#r-lives").setAttribute("aria-label", "Còn " + lives + " lượt");
        $("#r-score").textContent = caught + " từ";
        g.progress(spawned - drops.length, queue.length);
      };
      const remove = (d, cls) => { drops = drops.filter(x => x !== d); d.el.classList.add(cls); setTimeout(() => d.el.remove(), 450); };
      const end = () => {
        if (ended) return; ended = true; cancelAnimationFrame(raf);
        g.later(() => g.finish({ score: Math.round(20 * caught / queue.length) / 2, note: `Bắt được ${caught}/${queue.length} từ${hard ? " (chế độ khó)" : ""}` }), 700);
      };
      const tick = now => {
        if (G !== g || ended) return;
        const dt = Math.min(0.05, (now - last) / 1000); last = now;
        if (!document.hidden) {

        }
        raf = requestAnimationFrame(tick);
      };
      /* After a word is caught (or Enter is pressed) the box must be empty for the next word.
         Some keyboards (Vietnamese input methods, phone keyboards) keep their own copy of what was typed and
         put it back in front of the next word ("butterfly" + "parrot" → "butterflyparrot"). So:
         - the box is replaced by a fresh one, which ends the keyboard's composition on the old box;
         - whatever was already used ("eaten") is ignored if the keyboard types it again in front of the next word. */
      let eaten = "";

        const old = inp, el = old.cloneNode(false);

      };

        if (eaten && !full.startsWith(eaten) && !eaten.startsWith(full)) eaten = "";   // the keyboard started afresh

        if (eaten && full.length > eaten.length && full.startsWith(eaten)) out.push(full.slice(eaten.length).trim());
        return out.filter(Boolean);
      };
      const tryHit = () => {
        for (const v of typed()) {

          if (!d) continue;
          remove(d, "hit"); caught++; SFX.play("ok"); g.record(d.w, 1, "", hard);
          eaten = norm(inp.value); freshBox(); status();

        }
        return false;
      };
      function listen(el) {
        el.addEventListener("input", tryHit);

            if (isCur && cur[k]) return `<div class="wc f">${esc(cur[k])}</div>`;
            return '<div class="wc"></div>';
          }).join("") + "</div>";
        }
        $("#wd").innerHTML = h;
        $("#g-kbd").innerHTML = kbdHtml(k => keys[k] ? "k-" + { g: "good", y: "near", x: "no" }[keys[k]] : "", false,
          ['<button type="button" class="wide" data-key="enter">Đoán</button>', '<button type="button" class="wide" data-key="back" aria-label="Xóa chữ">⌫</button>']);
      };
      const end = (credit, typed) => {
        over = true; draw(); g.record(w, credit, typed);
        if (TTS.ok) TTS.say(w.w);
        $("#g-extra").innerHTML = (credit ? "" : tilesHtml(w.w, "good")) + `<button class="btn primary" type="button" id="g-next">${nextLabel(g, i)}</button>`;
      };
      const submit = () => {
        if (over) return;
        if (cur.length < L) { fb("bad", `Cần đủ ${L} chữ cái`); shake($("#wd").children[rows.length]); return; }
        const res = judge(cur), rank = { x: 0, y: 1, g: 2 };
        rows.push({ g: cur, res });
        for (let k = 0; k < L; k++) if (!keys[cur[k]] || rank[res[k]] > rank[keys[cur[k]]]) keys[cur[k]] = res[k];
        const guess = cur; cur = "";
        if (guess === ans) { SFX.play("ok"); fb("good", rows.length === 1 ? pick(PRAISE) : `Đúng rồi! Đoán ${rows.length} lượt.`); return end(rows.length === 1 ? 1 : 0.5, rows[0].g); }
        if (rows.length >= 6) { SFX.play("bad"); fb("bad", "Hết lượt rồi! Từ đúng là:"); return end(0, guess); }
        SFX.play("tap"); fb("", ""); draw();
      };
      const press = k => {
        if (k === "enter") return submit();
        if (over) return;
        if (k === "back") { cur = cur.slice(0, -1); draw(); return; }
        if (cur.length < L) { cur += k; draw(); }
      };
      const next = () => { i++; show(); };
      g.stage.onclick = e => {
        const b = e.target.closest("[data-key]"); if (b) return press(b.dataset.key);
        if (e.target.closest("#g-next")) next();
      };
      g.keyFn = e => {
        const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
        if (/^[a-z]$/.test(k)) { e.preventDefault(); press(k); }
        else if (k === "Backspace") { e.preventDefault(); press("back"); }
        else if (k === "Enter") { e.preventDefault(); if (over) next(); else press("enter"); }
      };
      draw();
    };
    show();
  },
};

/* ---------- 11. Từ theo ngữ cảnh ---------- */
/* Where the word sits in a sentence: a whole word in any case, maybe with an ending (cats, used, singing).
   Returns the sentence cut into text and gaps, or null when the sentence does not use the word. */
function ctxSplit(sentence, word) {
  const s = String(sentence || "").replace(/[’‘]/g, "'").replace(/\s+/g, " ").trim();
  const parts = norm(word).split(" ").filter(Boolean).map(p => p.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  if (!s || s.length > 240 || !parts.length) return null;
  let re;
  try { re = new RegExp("(^|[^A-Za-z])(" + parts.join("\\s+") + ")(s|es|ed|d|ing)?(?![A-Za-z])", "gi"); } catch { return null; }
  const out = [];
  let last = 0, m;
  while ((m = re.exec(s))) {
    const at = m.index + m[1].length, end = m[3] || "";
    out.push({ text: s.slice(last, at) }, { gap: true, form: m[2], end });
    last = at + m[2].length + end.length;
  }
  if (!out.length) return null;
  out.push({ text: s.slice(last) });
  return out;
}
/* The gap: one slot per letter, words of a phrase kept together; typed letters show up as they are typed. */
function gapHtml(word, letters, cls) {
  let k = 0;
  const groups = String(word).split(" ").filter(Boolean).map(part => `<span class="gw">${[...part].map(ch => {
    if (!isL(ch)) return `<b>${esc(ch)}</b>`;
    const c = letters[k++] || "";
    return `<i${c ? ' class="on"' : ""}>${esc(c)}</i>`;
  }).join("")}</span>`).join("");
  return `<span class="gap${onlyL(word).length > 11 ? " long" : ""}${cls ? " " + cls : ""}">${groups}</span>`;
}
function gapCount(word) {
  const n = norm(word).split(" ").filter(Boolean).length, letters = onlyL(word).length;
  return n > 1 ? `Cụm ${n} từ · ${letters} chữ cái` : `Từ có ${letters} chữ cái`;
}
function editDist(a, b) {
  a = norm(a); b = norm(b);
  const dp = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    let prev = dp[0]; dp[0] = i;
    for (let j = 1; j <= b.length; j++) { const t = dp[j]; dp[j] = Math.min(dp[j] + 1, dp[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = t; }
  }
  return dp[b.length];
}
GAMES.context = {
  id: "context", name: "Từ theo ngữ cảnh", en: "Words in Context", min: 1, count: 8, wide: true,
  filter: w => !!ctxSplit(w.ex, w.w),
  desc: "Đọc câu, đoán từ còn thiếu rồi gõ cho đúng chính tả. Mỗi lần chơi, AI đặt câu mới.",
  need: "Cần từ có câu ví dụ. Bấm “Sửa” rồi “AI bổ sung nghĩa, câu ví dụ”.",
  art: () => `<div class="ctx-art">Bees make sweet ${gapHtml("honey", [])}.</div>`,
  start(g) {
    g.stage.innerHTML = `<div class="ctxwrap"><p class="ctx" id="g-ctx"></p><div class="ctx-meta" id="g-meta"></div></div>
      <div class="row" id="g-tools" style="justify-content:center"></div><div id="g-clue"></div>
      ${answerHtml()}<div class="fb" id="g-fb" aria-live="polite"></div><div id="g-extra" style="width:100%"></div>`;
    const form = $("#g-form"), inp = $("#g-in");

    /* New sentences from AI, streamed in the order of the words. Each question waits a little for its own
       sentence; if AI is off, slow or fails, the word's saved example sentence is used instead. */
    const fresh = {}, wake = [];
    let ai = "off";
    const ping = () => wake.splice(0).forEach(f => f());
    if (aiReady()) {
      ai = "wait";
      const ctl = new AbortController(), cap = setTimeout(() => ctl.abort(), 25000);
      g.cleanups.push(() => { clearTimeout(cap); ctl.abort(); });
      aiLines({ mode: "context", level: g.set.level, items: g.words.map(x => ({ w: x.w, vi: x.vi || "" })) }, {
        signal: ctl.signal,
        onItem: o => {
          const x = g.words.find(y => norm(y.w) === norm(o.w));
          if (x && ctxSplit(o.ex, x.w)) fresh[norm(x.w)] = String(o.ex).replace(/\s+/g, " ").trim();
          ping();
        },
      }).catch(() => {}).then(() => { clearTimeout(cap); ai = "done"; ping(); });
    }

    let i = 0, w = null, pieces = null, tries = 0, phase = "wait", autoT = 0;
    let showVi = false, showFirst = false, usedHint = false;
    const gap = () => pieces.find(p => p.gap);
    const full = () => pieces.map(p => p.gap ? p.form + p.end : p.text).join("");
    const spoken = () => pieces.map(p => p.gap ? "…" : p.text).join("");
    const waiting = () => {
      $("#g-ctx").innerHTML = '<span class="working ctx-wait" role="status"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>AI đang đặt câu…</span>';
      $("#g-meta").textContent = ""; $("#g-tools").innerHTML = ""; inp.disabled = true;
    };
    const sentenceFor = (x, cb) => {
      const k = norm(x.w);
      let done = false;
      const fin = () => { if (done || G !== g) return; done = true; cb(fresh[k] || x.ex); };
      const check = () => { if (done) return; if (fresh[k] || ai !== "wait") fin(); else wake.push(check); };
      check();
      if (!done) { waiting(); g.later(fin, 7000); }
    };
    const draw = cls => {
      const over = phase === "done", typed = [...onlyL(inp.value)];
      $("#g-ctx").innerHTML = pieces.map(p => p.gap ? gapHtml(w.w, over ? [...onlyL(p.form)] : typed, over ? cls : "") + esc(p.end) : esc(p.text)).join("");
      $("#g-meta").innerHTML = over ? "" : esc(gapCount(w.w)) + (showFirst ? ` · bắt đầu bằng chữ <b>${esc(onlyL(w.w)[0])}</b>` : "");
    };
    const clue = () => { $("#g-clue").innerHTML = showVi ? clueHtml(w, true) : ""; };
    const tools = () => {
      const label = phase !== "ask" ? "" : !showVi && (w.vi || w.e) ? "Gợi ý nghĩa" : !showFirst ? "Gợi ý chữ đầu" : "";
      $("#g-tools").innerHTML = (TTS.ok ? `<button class="btn sm" type="button" data-say="ex">${ICON.speaker} Nghe câu</button>` : "")
        + (label ? `<button class="btn sm ghost" type="button" id="g-hint">${label}</button>` : "");
    };
    const nextRow = () => `<div class="row" style="justify-content:center;margin-top:14px"><button class="btn primary" type="button" id="g-next">${i + 1 < g.words.length ? "Câu tiếp theo" : "Xem điểm"}</button></div>`;
    const show = () => {
      clearTimeout(autoT);
      if (i >= g.words.length) return g.finish();
      w = g.words[i]; g.cur = null; pieces = null; tries = 0; phase = "wait";
      showVi = false; showFirst = false; usedHint = false;
      g.hud(`${i + 1}/${g.words.length}`); g.progress(i, g.words.length);
      $("#g-extra").innerHTML = ""; $("#g-clue").innerHTML = ""; fb("", "");
      inp.value = ""; inp.className = "inp";
      sentenceFor(w, s => {
        pieces = ctxSplit(s, w.w) || ctxSplit(w.ex, w.w);
        if (!pieces) { i++; return show(); }
        phase = "ask"; inp.disabled = false;
        g.cur = Object.assign({}, w, { ex: spoken() });
        draw(); tools(); clue();
        try { inp.focus({ preventScroll: true }); } catch {}
      });
    };
    const next = () => { i++; show(); };
    const settle = (credit, typed, cls) => {
      phase = "done"; g.record(w, credit, typed);
      g.cur = Object.assign({}, w, { ex: full() });
      showVi = !!(w.vi || w.e); clue(); draw(cls); tools();
    };
    const hint = () => {
      if (phase !== "ask") return;
      usedHint = true;
      if (!showVi && (w.vi || w.e)) showVi = true; else showFirst = true;
      clue(); draw(); tools();
      try { inp.focus({ preventScroll: true }); } catch {}
    };
    form.addEventListener("submit", e => {
      e.preventDefault();
      if (G !== g) return;
      if (phase === "done") { next(); return; }
      if (phase !== "ask") return;
      const typed = inp.value.trim();
      if (!typed) { inp.focus(); return; }
      const p = gap();
      if (norm(typed) === norm(w.w) || norm(typed) === norm(p.form + p.end)) {
        const half = tries > 0 || usedHint;
        inp.className = "inp good"; SFX.play("ok");
        fb("good", half ? "Đúng rồi!" : pick(PRAISE));
        settle(half ? 0.5 : 1, typed, "good");
        $("#g-extra").innerHTML = nextRow();
        if (TTS.ok) TTS.say(w.w);
        autoT = g.later(next, 2600);
      } else if (tries === 0) {
        tries = 1; inp.className = "inp bad"; shake(inp); SFX.play("bad");
        const other = (g.set.words || []).some(x => norm(x.w) === norm(typed));
        fb("bad", other ? `“${typed}” là một từ khác trong bộ. Câu này cần từ khác, xem gợi ý nhé!` : "Chưa đúng. Xem gợi ý rồi thử lại nhé!");
        showVi = !!(w.vi || w.e); showFirst = true;
        clue(); draw(); tools();
        g.later(() => { inp.className = "inp"; inp.select(); }, 600);
      } else {
        inp.className = "inp bad"; SFX.play("bad");
        fb("bad", "Xem từ đúng nhé");
        settle(0, typed, "bad");
        const close = editDist(typed, w.w) <= Math.max(2, Math.ceil(onlyL(w.w).length / 3));
        $("#g-extra").innerHTML = (close ? diffHtml(typed, w.w) : `<div class="diff"><span class="lab">Từ đúng</span><span>${esc(w.w)}</span></div>`) + nextRow();
        if (TTS.ok) g.later(() => TTS.say(w.w), 400);
      }
    });
    inp.addEventListener("input", () => { if (phase === "ask") draw(); });
    g.stage.addEventListener("click", e => {
      if (G !== g) return;
      if (e.target.closest("#g-hint")) { hint(); return; }
      if (e.target.closest("#g-next")) { clearTimeout(autoT); next(); return; }
      if (e.target.closest("[data-say]")) clearTimeout(autoT);   // listening to the sentence: stay on it
    });
    show();
  },
};

const GAME_LIST = ["bee", "missing", "scramble", "look", "register", "search", "memory", "rain", "wordle", "context"].map(k => GAMES[k]);

/* =========================================================
   Spaced review. A word enters the schedule the first time it is
   played in a graded game (that day = day 0). It comes back on day
   +1, +3, +7, +15, +30, +60. A correct review moves it to the next
   milestone; a wrong answer sends it back to +1. Reviewing late
   shifts the later milestones by the same delay.
   Per word (in stats/<setId>.words[word]): f first day, s reviews passed
   (0..6), l last review day, d next due day, h recent history.
   ========================================================= */
const SRS_OFFSETS = [1, 3, 7, 15, 30, 60];
const SRS_GAPS = SRS_OFFSETS.map((d, i) => d - (i ? SRS_OFFSETS[i - 1] : 0));
const SRS_DONE = SRS_OFFSETS.length;
const REVIEW_MAX = 20;
const WEEKDAYS = ["CN", "T2", "T3", "T4", "T5", "T6", "T7"];
const WEEKDAYS_LONG = ["Chủ nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"];

function dayNum(t) {
  const d = t == null ? new Date() : new Date(t);
  return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
}
function dayDate(n) {
  const d = new Date(n * 86400000);
  return String(d.getUTCDate()).padStart(2, "0") + "/" + String(d.getUTCMonth() + 1).padStart(2, "0");
}
function dayWeek(n, long) { return (long ? WEEKDAYS_LONG : WEEKDAYS)[new Date(n * 86400000).getUTCDay()]; }
function dayLabel(n, today) {
  const diff = n - (today == null ? dayNum() : today);
  if (diff <= 0) return "Hôm nay";
  if (diff === 1) return "Ngày mai";
  return dayWeek(n) + " " + dayDate(n);
}

function srsStatus(rec, today) {
  if (!rec || rec.f == null) return "new";
  if (rec.s >= SRS_DONE) return "done";
  return rec.d <= today ? "due" : "wait";
}
function srsApply(rec, credit, today) {
  const r = Object.assign({}, rec || {});
  if (r.f == null) { r.f = today; r.s = 0; r.l = today; r.d = today + SRS_GAPS[0]; return r; }
  const due = r.s < SRS_DONE && r.d <= today;
  if (credit >= 1) {
    if (due) { r.s += 1; r.l = today; r.d = r.s < SRS_DONE ? today + SRS_GAPS[r.s] : null; }
  } else if (credit > 0) {
    if (due) { r.l = today; r.d = today + 1; }
  } else {
    r.s = 0; r.l = today; r.d = today + SRS_GAPS[0];
  }
  return r;
}

function setSrs(set, today) {
  const st = statsFor(set.id).words, out = { new: 0, wait: 0, due: 0, done: 0, dueKeys: new Set() };
  for (const w of set.words) {
    const k = norm(w.w), s = srsStatus(st[k], today);
    out[s]++;
    if (s === "due") out.dueKeys.add(k);
  }
  return out;
}
/* Every word across all sets, merged when the same word sits in several sets. */
function srsAll(today) {
  const rank = { due: 0, wait: 1, new: 2, done: 3 }, map = new Map();
  for (const set of S.sets) {
    const st = statsFor(set.id).words;
    for (const w of set.words || []) {
      const k = norm(w.w), rec = st[k], status = srsStatus(rec, today);
      const prev = map.get(k);
      if (!prev) { map.set(k, { w, k, sids: [set.id], names: [set.name], rec, status }); continue; }
      prev.sids.push(set.id); prev.names.push(set.name);
      const better = rank[status] < rank[prev.status] || (status === prev.status && rec && prev.rec && (rec.d || 0) < (prev.rec.d || 0));
      if (better) Object.assign(prev, { w, rec, status, names: [set.name].concat(prev.names.filter(n => n !== set.name)) });
    }
  }
  return [...map.values()];
}
function srsNext(all, today) {
  let day = Infinity;
  for (const x of all) if (x.status === "wait" && x.rec.d < day) day = x.rec.d;
  if (day === Infinity) return null;
  return { day, count: all.filter(x => x.status === "wait" && x.rec.d === day).length };
}

function startReview() {
  const today = dayNum();
  const due = srsAll(today).filter(x => x.status === "due").sort((a, b) => a.rec.d - b.rec.d);
  if (!due.length) { toast("Hôm nay không có từ nào cần ôn."); go("home"); return; }
  const words = due.slice(0, REVIEW_MAX).map(x => Object.assign({}, x.w, { _sids: x.sids }));
  startGame("bee", { words, review: true, max: REVIEW_MAX, set: { id: "__review", name: "Ôn tập hôm nay", words, virtual: true } });
}

function updateBadge() {
  try {
    if (!S.setsLoaded || !("setAppBadge" in navigator)) return;
    const n = srsAll(dayNum()).filter(x => x.status === "due").length;
    const p = n ? navigator.setAppBadge(n) : navigator.clearAppBadge();
    if (p && p.catch) p.catch(() => {});
  } catch {}
}

/* ---------- Home: today's review card ---------- */
function reviewCardHtml() {
  if (!S.setsLoaded || !S.sets.length) return "";
  const today = dayNum(), all = srsAll(today);
  const due = all.filter(x => x.status === "due"), learned = all.filter(x => x.status !== "new");
  let body;
  if (!learned.length) {
    body = `<div class="rc-title">Lịch ôn từ vựng</div>
      <p class="rc-text">Chơi một trò bất kỳ. Các từ đã chơi sẽ được nhắc ôn lại sau 1, 3, 7, 15, 30 và 60 ngày.</p>
      <div class="row"><button class="btn sm" type="button" data-act="plan">Xem cách tính lịch ôn</button></div>`;
  } else if (due.length) {
    const bySet = new Map();
    for (const x of due) bySet.set(x.names[0], (bySet.get(x.names[0]) || 0) + 1);
    const n = Math.min(due.length, REVIEW_MAX);
    body = `<div class="rc-count"><span class="rc-num">${due.length}</span><span class="rc-unit">từ cần ôn hôm nay</span></div>
      <div class="rc-sets">${[...bySet].slice(0, 4).map(([name, c]) => `<span>${esc(name)} · ${c}</span>`).join("")}${bySet.size > 4 ? `<span>+${bySet.size - 4} bộ</span>` : ""}</div>
      <div class="row"><button class="btn primary" type="button" data-act="review">Ôn ngay${due.length > REVIEW_MAX ? ` ${n} từ` : ""}</button><button class="btn ghost" type="button" data-act="plan">Lịch ôn</button></div>`;
  } else {
    const next = srsNext(all, today);
    const doneToday = learned.some(x => x.rec.l === today && x.rec.f !== today);
    body = `<div class="rc-title">${doneToday ? "Hôm nay đã ôn xong" : "Hôm nay chưa có từ cần ôn"}</div>
      <p class="rc-text">${next ? `Lần ôn tới: <b>${dayLabel(next.day, today)}</b> · ${next.count} từ` : "Các từ đã học đều đã thuộc."}</p>
      <div class="row"><button class="btn sm" type="button" data-act="plan">Xem lịch ôn</button></div>`;
  }
  return `<section class="revcard" aria-label="Ôn tập hôm nay"><div class="rc-top"><span>${dayWeek(today, true)}</span><span>${dayDate(today)}</span></div><div class="rc-body">${body}</div></section>`;
}

function srsBarHtml(sr, total) {
  const learn = sr.due + sr.wait;
  if (!total) return "";
  return `<div class="srsline" aria-hidden="true">${sr.done ? `<span class="s-done" style="flex:${sr.done}"></span>` : ""}${learn ? `<span class="s-learn" style="flex:${learn}"></span>` : ""}${sr.new ? `<span class="s-new" style="flex:${sr.new}"></span>` : ""}</div>
    <div class="srslegend">Đã thuộc ${sr.done} · Đang ôn ${learn} · Chưa học ${sr.new}</div>`;
}
function chipHtml(w, weak, dueKeys) {
  const k = norm(w.w), cls = ["chip"];
  if (weak.has(k)) cls.push("weak");
  if (dueKeys.has(k)) cls.push("due");
  if (w.t === "idiom") cls.push("idiom");
  if (w.t === "adv") cls.push("adv");
  return `<span class="${cls.join(" ")}" title="${esc(w.vi)}">${esc(w.w)}</span>`;
}

/* ---------- Schedule page ---------- */
function planHtml() {
  const today = dayNum(), all = srsAll(today);
  const counts = { new: 0, due: 0, wait: 0, done: 0 }, stage = SRS_OFFSETS.map(() => 0);
  for (const x of all) { counts[x.status]++; if (x.status === "due" || x.status === "wait") stage[Math.min(x.rec.s, SRS_DONE - 1)]++; }
  const ladder = `<ol class="ladder">
    <li class="lad-new"><span class="node">Mới</span><span class="cnt">${counts.new}</span><span class="cap">chưa học</span></li>
    ${SRS_OFFSETS.map((d, i) => `<li><span class="node">+${d}</span><span class="cnt">${stage[i]}</span><span class="cap">lần ôn ${i + 1}</span></li>`).join("")}
    <li class="lad-done"><span class="node">✓</span><span class="cnt">${counts.done}</span><span class="cap">đã thuộc</span></li>
  </ol>`;
  const groups = new Map();
  for (const x of all) {
    if (x.status !== "due" && x.status !== "wait") continue;
    const d = Math.max(x.rec.d, today);
    if (!groups.has(d)) groups.set(d, []);
    groups.get(d).push(x);
  }
  const days = [...groups.keys()].sort((a, b) => a - b);
  const list = days.length ? days.slice(0, 30).map(d => {
    const items = groups.get(d);
    return `<div class="dayrow${d === today ? " today" : ""}">

/* ---------- Daily reminder on the phone's calendar ---------- */
function remParts(t) {
  const m = /^(\d{1,2}):(\d{2})/.exec(t || "");
  const h = m ? clamp(+m[1], 0, 23) : 19, mi = m ? clamp(+m[2], 0, 59) : 30;
  const endMin = Math.min(h * 60 + mi + 15, 23 * 60 + 59);
  const p = n => String(n).padStart(2, "0"), now = new Date();
  return { hhmm: p(h) + p(mi), end: p(Math.floor(endMin / 60)) + p(endMin % 60), d: now.getFullYear() + p(now.getMonth() + 1) + p(now.getDate()) };
}
function icsUrl(t) { const r = remParts(t); return `/api/ics?t=${r.hhmm}&d=${r.d}`; }
function gcalUrl(t) {
  const r = remParts(t);
  let tz = "Asia/Ho_Chi_Minh";
  try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || tz; } catch {}
  const app = APP_MODE === "web" ? location.origin + "/" : "";
  const q = new URLSearchParams({
    action: "TEMPLATE", text: "Ôn từ vựng – Vở Spelling",
    details: "Mở app để ôn các từ đến hạn hôm nay." + (app ? " " + app : ""),
    dates: `${r.d}T${r.hhmm}00/${r.d}T${r.end}00`, ctz: tz, recur: "RRULE:FREQ=DAILY",
  });
  return "https://calendar.google.com/calendar/render?" + q.toString();
}
function reminderHtml() {
  const t = prefs.remind || "19:30", web = APP_MODE === "web";
  return `<section class="sheet remind" aria-labelledby="rem-h">
    <h2 class="plan-h" id="rem-h" style="margin:0">Nhắc ôn hằng ngày</h2>
    <p class="muted small" style="margin:6px 0 14px;max-width:60ch">Đặt một lời nhắc lặp lại mỗi ngày trên lịch điện thoại. Đến giờ, điện thoại báo để con mở app và ôn các từ đến hạn.</p>
    <div class="row" style="align-items:end">
      <div class="field" style="width:130px"><label for="rem-time">Giờ nhắc</label><input id="rem-time" class="inp" type="time" value="${esc(t)}"></div>
      ${web ? `<a class="btn primary" id="rem-ics" href="${esc(icsUrl(t))}" target="_blank" rel="noopener">Thêm vào Lịch (iPhone, máy tính)</a>` : ""}
      <a class="btn" id="rem-gcal" href="${esc(gcalUrl(t))}" target="_blank" rel="noopener">Thêm vào Google Calendar</a>
    </div>
  </section>`;
}
function updateReminderLinks(t) {
  const a = $("#rem-ics"), b = $("#rem-gcal");

/* =========================================================
   Learner accounts (web only). Each learner signs in with a username and a
   4–8 digit PIN. Word sets and the review schedule live in the cloud
   (/api/data → Upstash Redis). The device keeps a copy for an instant start
   and an outbox of changes that could not be sent yet (offline).
   ========================================================= */
const ACC = { enabled: false, token: null, user: null, offline: false, outbox: {}, tab: "", error: "", busy: false, form: {}, importSets: null };
const readJSON = k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch { return null; } };
const writeJSON = (k, v) => { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const USER_OK = /^[a-z0-9][a-z0-9._-]{1,19}$/;
const initial = s => (Array.from(String(s || "").trim())[0] || "?").toUpperCase();
const cacheKey = () => "vs.cache." + ACC.user.uid;
const outKey = () => "vs.outbox." + ACC.user.uid;

function accRestore() { const s = readJSON("vs.session"); if (s && s.token && s.user) { ACC.token = s.token; ACC.user = s.user; } }
function accPersist() { writeJSON("vs.session", ACC.token ? { token: ACC.token, user: ACC.user } : null); }
function recentLearners() { return (readJSON("vs.recent") || []).filter(x => x && x.username).slice(0, 6); }
function rememberLearner(u) { writeJSON("vs.recent", [{ username: u.username, name: u.name }].concat(recentLearners().filter(x => x.username !== u.username)).slice(0, 6)); }
function slugUser(s) {
  return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[đĐ]/g, "d").toLowerCase()
    .replace(/[^a-z0-9]+/g, ".").replace(/^\.+|\.+$/g, "").slice(0, 20);
}
const needLogin = () => APP_MODE === "web" && ACC.enabled && !ACC.user;

async function api(path, opts) {
  const o = Object.assign({ method: "GET" }, opts || {});
  o.headers = Object.assign({ "Content-Type": "application/json" }, ACC.token ? { Authorization: "Bearer " + ACC.token } : {});
  let r;
  try { r = await fetch(path, o); } catch { throw { code: "network" }; }
  const j = await r.json().catch(() => null);
  if (!r.ok) {
    const code = (j && j.error) || "http_" + r.status;
    if (code === "auth" && ACC.token) sessionLost();
    throw { code, status: r.status };
  }
  return j || {};
}
function authErrMsg(e) {
  switch (e && e.code) {
    case "taken": return "Tên đăng nhập này đã có người dùng. Chọn tên khác nhé.";
    case "bad_username": return "Tên đăng nhập viết thường, không dấu (chữ, số, dấu chấm), 2–20 ký tự.";
    case "bad_pin": return "Mã PIN gồm 4 đến 8 chữ số.";
    case "wrong": return "Sai tên đăng nhập hoặc mã PIN.";
    case "locked": return "Nhập sai nhiều lần quá. Đợi 15 phút rồi thử lại.";
    case "slow_down": return "Tạo nhiều tài khoản quá. Đợi một lúc rồi thử lại.";
    case "network": return "Không kết nối được. Kiểm tra mạng rồi thử lại.";
    default: return "Máy chủ chưa lưu được tài khoản lúc này. Thử lại sau ít phút.";
  }
}

/* ---------- Boot: accounts when the server has a store, otherwise this device only ---------- */
async function connectWebStore() {
  accRestore();
  let info = null;
  try { info = await api("/api/auth"); } catch { info = null; }
  if (info && info.accounts) {
    ACC.enabled = true;
    if (info.user) { ACC.user = info.user; accPersist(); return startCloud(); }
    if (ACC.token) { ACC.token = null; ACC.user = null; accPersist(); ACC.error = "Phiên đăng nhập đã hết. Đăng nhập lại nhé."; }
    return showLogin();
  }
  if (!info && ACC.token && ACC.user) { ACC.enabled = true; ACC.offline = true; return startCloud(); }
  Store.kind = "local";
  subscribeAll();
}
function showLogin() {
  Store.kind = "none"; S.sets = []; S.stats = {}; S.setsLoaded = false;
  if (!ACC.tab) ACC.tab = recentLearners().length ? "login" : "signup";
  go("login");
}
function sessionLost() {
  ACC.token = null; ACC.user = null; accPersist();
  ACC.error = "Phiên đăng nhập đã hết. Đăng nhập lại nhé."; ACC.tab = "login";
  showLogin();
}

async function startCloud() {
  Store.kind = "cloud";
  ACC.outbox = readJSON(outKey()) || {};
  const cache = readJSON(cacheKey());
  S.sets = cache ? cache.sets || [] : []; S.stats = cache ? cache.stats || {} : {}; S.setsLoaded = !!cache;
  if (S.view === "login" || S.view === "import" || !S.view) S.view = "home";
  render(); onData();
  await cloudPull();
}
async function cloudPull() {
  try {
    await flushOutbox();
    const d = await api("/api/data");
    S.sets = d.sets || []; S.stats = d.stats || {}; S.setsLoaded = true; ACC.offline = false;
    if (!S.sets.length && !readJSON(cacheKey())) {
      S.sets = [JSON.parse(JSON.stringify(SAMPLE_SET))];   // a new account starts with the sample set
      cloudQueue("set:" + SAMPLE_SET.id);
      flushOutbox().catch(() => {});
    }
    writeCache();
  } catch (e) {
    if (Store.kind !== "cloud") return;
    ACC.offline = true; S.setsLoaded = true;
  }
  if (Store.kind === "cloud") onData();
}
function writeCache() { if (ACC.user) writeJSON(cacheKey(), { sets: S.sets, stats: S.stats }); }

/* ---------- Outbox: every change is queued, then sent; what fails stays queued ---------- */
let obSeq = 0;
function cloudQueue(key) { ACC.outbox[key] = Date.now() + "." + (++obSeq); writeJSON(outKey(), ACC.outbox); }
function setDocOf(s) { if (!s) return null; const d = Object.assign({}, s); delete d.id; return d; }
async function sendOps(ops) {
  let batch = [], size = 0;
  for (const op of ops) {
    const n = JSON.stringify(op).length;
    if (batch.length && (size + n > 1500000 || batch.length >= 150)) { await api("/api/data", { method: "POST", body: JSON.stringify({ ops: batch }) }); batch = []; size = 0; }
    batch.push(op); size += n;
  }
  if (batch.length) await api("/api/data", { method: "POST", body: JSON.stringify({ ops: batch }) });
}
function flushOutbox() {
  return queued("outbox", async () => {
    if (Store.kind !== "cloud" || !ACC.token) return;
    const snap = Object.assign({}, ACC.outbox), keys = Object.keys(snap);
    if (!keys.length) return;
    const ops = [];
    for (const k of keys) {
      const i = k.indexOf(":"), t = k.slice(0, i), id = k.slice(i + 1);
      if (t === "del") ops.push({ op: "del", id });
      else if (t === "set") { const d = setDocOf(S.sets.find(s => s.id === id)); if (d) ops.push({ op: "put", type: "set", id, doc: d }); }
      else if (t === "stats") { const d = S.stats[id]; if (d) ops.push({ op: "put", type: "stats", id, doc: d }); }
    }
    if (ops.length) await sendOps(ops);
    for (const k of keys) if (ACC.outbox[k] === snap[k]) delete ACC.outbox[k];
    writeJSON(outKey(), ACC.outbox);
    ACC.offline = false;
  });
}
async function cloudWrite(key) {
  cloudQueue(key); writeCache(); updateStorePill();
  try { await flushOutbox(); } catch (e) { if (e && e.code !== "auth") ACC.offline = true; }
  updateStorePill();
}
window.addEventListener("online", () => { if (Store.kind === "cloud") flushOutbox().then(updateStorePill, () => {}); });

/* ---------- Word sets made on this device before accounts ---------- */
function guestData() {
  const d = readJSON("vs.data");

  const played = id => stats[id] && Object.keys(stats[id].words || {}).length;

  return sets.length ? { sets, stats } : null;

async function doImport(yes) {
  const g = ACC.importSets;
  if (!yes || !g) {
    if (ACC.user) writeJSON("vs.import.skip." + ACC.user.uid, true);
    ACC.importSets = null; return startCloud();
  }
  ACC.busy = true; ACC.error = ""; render();
  try {
    const ops = [];
    for (const s of g.sets) {
      ops.push({ op: "put", type: "set", id: s.id, doc: setDocOf(s) });
      if (g.stats[s.id]) ops.push({ op: "put", type: "stats", id: s.id, doc: g.stats[s.id] });
    }
    await sendOps(ops);
    try { localStorage.setItem("vs.data.imported", localStorage.getItem("vs.data") || ""); localStorage.removeItem("vs.data"); } catch {}
    ACC.importSets = null; ACC.busy = false;
    toast(`Đã chuyển ${g.sets.length} bộ từ vào tài khoản.`);
    await startCloud();
  } catch (e) {
    ACC.busy = false; ACC.error = authErrMsg(e); render();
  }
}

  if (r.review) {
    const nx = srsNext(all, dayNum());
    note = dueLeft ? `Còn ${dueLeft} từ cần ôn hôm nay.` : `Hôm nay ôn xong rồi!${nx ? ` Lần ôn tới: ${dayLabel(nx.day)} · ${nx.count} từ.` : ""}`;
    acts = `${dueLeft ? `<button class="btn primary" type="button" data-act="review">Ôn tiếp ${Math.min(dueLeft, REVIEW_MAX)} từ</button>` : ""}
      ${missed ? `<button class="btn${dueLeft ? "" : " primary"}" type="button" data-again="missed">Viết lại ${missed} từ sai</button>` : ""}
      <button class="btn ghost" type="button" data-act="home">Về trang chính</button>`;
  } else {
    if (Object.keys(next).length) note = "Các từ vừa chơi đã có lịch ôn. Đến ngày, trang chính sẽ nhắc ôn lại.";
    acts = `<button class="btn primary" type="button" data-again="1">Chơi lại</button>
      ${missed ? `<button class="btn" type="button" data-again="missed">Ôn ${missed} ${def.unit || "từ"} chưa đúng</button>` : ""}
      <button class="btn ghost" type="button" data-act="home">Chọn trò khác</button>`;
  }
  return `<div class="page" style="max-width:640px">
    <div class="page-h"><button class="iconbtn" type="button" data-act="home" aria-label="Về trang chính">${ICON.back}</button><h1${!r.review && def.name.length > 18 ? ' class="long"' : ""}>${r.review ? "Bài ôn hôm nay" : "Bài làm · " + esc(def.name)}</h1></div>
    <div class="paper">
      <div class="mark">
        <div><div class="lab">Điểm</div><div class="score" aria-label="Điểm ${fmt(r.score)} trên 10">${fmt(r.score)}</div></div>
        <div><div class="lab">Lời phê của thầy cô</div><div class="loiphe">${esc(loiPhe(r.score))}</div>
          ${r.isBest && r.score > 0 ? '<div style="margin-top:8px"><span class="pill ok">Điểm cao nhất mới</span></div>' : ""}
          ${r.extra && r.extra.note ? `<div class="small muted" style="margin-top:6px">${esc(r.extra.note)}</div>` : ""}</div>
      </div>
      ${rows ? `<ul class="reslist">${rows}</ul>` : '<div style="height:12px"></div>'}
      ${note ? `<p class="res-note">${note}</p>` : ""}
      <div class="res-acts">${acts}</div>
    </div>
  </div>`;
}

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const t = e.target;
  if (!t || !t.closest) return;
  if (t.closest("#exitbtn")) { closeSettings(); ontapPost({ action: "exit" }); return; }   // Ôn Tập: về lại Ôn Tập
  if (t.closest("#setbtn") || t.closest("#userchip")) { const p = $("#settings"); if (p.hidden) openSettings(); else closeSettings(); return; }
  if (t.closest("#brand")) { if (G && G.arena && window.Arena) { Arena.quit(); return; } if (S.view !== "login" && S.view !== "import") go("home"); return; }   // Ôn Tập: thi đấu
  if (t.closest("#p-logout")) { logout(); return; }
  const lgtab = t.closest("[data-lgtab]");
  if (lgtab) { ACC.tab = lgtab.dataset.lgtab; ACC.error = ""; render(); return; }
  const rec = t.closest("[data-recent]");
  if (rec) { ACC.tab = "login"; ACC.error = ""; ACC.form = { user: rec.dataset.recent }; render(); const pin = $("#lg-pin"); if (pin) pin.focus(); return; }
  if (t.closest("#imp-yes")) { doImport(true); return; }
  if (t.closest("#imp-no")) { doImport(false); return; }
  const pref = t.closest("[data-pref]");
  if (pref) {
    const k = pref.dataset.pref, v = pref.dataset.val;
    prefs[k] = k === "rate" ? parseFloat(v) : v; savePrefs(); openSettings();
    TTS.say(prefs.accent === "en-GB" ? "Hello! Let's spell." : "Hi! Let's spell.");
    return;
  }
  if (t.closest("#p-test")) { if (!TTS.say("Hello! Let's spell: apple. A, P, P, L, E.")) toast("Trình duyệt này không đọc được tiếng."); return; }
  if (!t.closest("#settings")) closeSettings();

  const say = t.closest("[data-say]");
  if (say && G && G.cur) {
    const w = G.cur, k = say.dataset.say;
    if (k === "ex") TTS.say(w.ex || w.w); else TTS.say(w.w, k === "slow");
    return;
  }
  const act = t.closest("[data-act]");
  if (act) {
    const a = act.dataset.act;
    if (a === "home") { if (G && G.arena && window.Arena) Arena.quit(); else go("home"); }   // Ôn Tập: thi đấu
    else if (a === "sets") go("sets");
    else if (a === "new" && canWrite()) { S.create = newCreate(act.dataset.mode); go("create"); }
    else if (a === "edit") { const s = curSet(); if (s) { S.create = editCreate(s); go("create"); } }
    else if (a === "expand" && canWrite()) { const s = curSet(); if (s) { S.create = expandCreate(s); go("create"); } }
    else if (a === "review") { SFX.play("tap"); startReview(); }
    else if (a === "plan") go("plan");
    return;
  }
  const gm = t.closest("[data-game]");
  if (gm) { SFX.play("tap"); startGame(gm.dataset.game); return; }
  const pk = t.closest("[data-pick]");
  if (pk) { S.setId = pk.dataset.pick; prefs.setId = S.setId; S.weakOnly = false; prefs.weakOnly = false; savePrefs(); go("home"); return; }
  const ed = t.closest("[data-editset]");
  if (ed) { const s = S.sets.find(x => x.id === ed.dataset.editset); if (s) { S.create = editCreate(s); go("create"); } return; }
  const ag = t.closest("[data-again]");
  if (ag && S.result) {
    const r = S.result;
    if (ag.dataset.again === "missed") {
      const seen = new Set();
      const ws = r.items.filter(it => it.credit < 1).map(it => it.w).filter(w => { const k = norm(w.w); if (seen.has(k)) return false; seen.add(k); return true; });
      if (r.review) startGame(r.gameId, { words: ws, max: REVIEW_MAX, set: { id: "__review", name: "Viết lại từ sai", words: ws, virtual: true } });
      else startGame(r.gameId, { words: ws });
    } else if (r.review) startReview();
    else startGame(r.gameId);
    return;
  }
  if (S.view === "create" && S.create) createClick(t);
});

function createClick(t) {
  const c = S.create;
  const tab = t.closest("[data-mode-tab]");
  if (tab) { if (c.working) return; c.mode = tab.dataset.modeTab; c.error = ""; renderCreate(); return; }
  const kind = t.closest("[data-kind]");
  if (kind) { if (c.working) return; c.kind = kind.dataset.kind; c.count = KIND_OPTS[c.kind].def; c.error = ""; renderCreate(); return; }
  if (t.closest("#c-again")) { if (c.ctl) c.ctl.abort(); c.words = []; c.step = "input"; c.error = ""; renderCreate(); return; }
  if (t.closest("#c-pick")) { const f = $("#c-file"); if (f) f.click(); return; }
  if (t.closest("#c-go")) { if (!c.working) runCreate(); return; }
  if (t.closest("#c-stop")) { if (c.ctl) c.ctl.abort(); return; }
  const del = t.closest("[data-del]");
  if (del) { c.words.splice(+del.dataset.del, 1); renderCreate(); return; }
  if (t.closest("#c-add")) {
    c.words.push({ w: "", vi: "", ex: "", e: "" }); renderCreate();
    const inp = $("#rw-" + (c.words.length - 1)); if (inp) inp.focus();
    return;
  }
  if (t.closest("#c-fill")) { runEnrich(c.words.map((w, i) => (w.w && (!w.vi || !w.ex)) ? i : -1).filter(i => i >= 0)); return; }
  if (t.closest("#c-save")) { saveCreate(); return; }
  if (t.closest("#c-restart")) { if (c.ctl) c.ctl.abort(); S.create = Object.assign(newCreate(c.mode), { level: c.level }); renderCreate(); return; }
  if (t.closest("#c-del")) { c.confirmDel = true; renderCreate(); return; }
  if (t.closest("#c-del-yes")) { deleteEditing(); return; }
  if (t.closest("#c-del-no")) { c.confirmDel = false; renderCreate(); }
}

document.addEventListener("submit", e => {
  if (e.target && e.target.id === "lg-form") { e.preventDefault(); submitLogin(); }
});
/* In the games, letters with Vietnamese marks ("tigẻ" for "tiger") mean a Vietnamese input method is on. Say so once. */
let viTypingHint = false;
document.addEventListener("input", e => {
  const t = e.target;
  if (viTypingHint || !t || t.id !== "g-in" || !/[À-ɏḀ-ỿ]/.test(t.value)) return;
  viTypingHint = true;
  toast("Máy đang gõ tiếng Việt có dấu. Tắt bộ gõ tiếng Việt (Unikey, EVKey: chuyển sang E) hoặc đổi bàn phím điện thoại sang tiếng Anh để gõ đúng từ nhé.", 8000);
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t && t.id === "lg-name") {
    ACC.form.name = t.value;
    const u = $("#lg-user");
    if (u && !ACC.form.userEdited) { u.value = slugUser(t.value); ACC.form.user = u.value; }
    return;
  }
  if (t && t.id === "lg-user") { ACC.form.user = t.value; ACC.form.userEdited = true; return; }
  if (S.view !== "create" || !S.create || !t) return;
  const c = S.create;
  if (t.id === "c-text") c.text = t.value;
  else if (t.id === "c-topic") c.topic = t.value;
  else if (t.id === "c-name") { c.name = t.value; c.nameAuto = false; }
  else if (t.dataset && t.dataset.f) {
    const row = t.closest(".revrow"), i = row ? +row.dataset.i : -1;
    if (c.words[i]) { c.words[i][t.dataset.f] = t.value; if (t.dataset.f === "w") delete c.words[i].fixed; }
  }
});
document.addEventListener("change", e => {
  const t = e.target; if (!t) return;
  if (t.id === "weakOnly") { S.weakOnly = t.checked; prefs.weakOnly = t.checked; savePrefs(); return; }
  if (t.id === "p-sound") { prefs.sound = t.checked; savePrefs(); return; }
  if (t.id === "p-vi") { prefs.showVi = t.checked; savePrefs(); return; }
  if (t.id === "rem-time") { prefs.remind = t.value || "19:30"; savePrefs(); updateReminderLinks(prefs.remind); return; }
  if (S.view !== "create" || !S.create) return;
  const c = S.create;
  if (t.id === "c-enrich") c.enrich = t.checked;
  else if (t.id === "c-level") c.level = t.value;
  else if (t.id === "c-count") c.count = parseInt(t.value, 10) || 15;
  else if (t.id === "c-file") {
    const f = t.files && t.files[0];
    if (!f) return;
    if (c.fileUrl) { try { URL.revokeObjectURL(c.fileUrl); } catch {} }
    c.file = f; c.fileUrl = URL.createObjectURL(f); c.error = ""; renderCreate();
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeSettings();
  if (e.key === "Enter" && e.target && e.target.id === "c-topic" && S.create && !S.create.working) { e.preventDefault(); runCreate(); }
});

/* ---------- Boot ---------- */
let booted = false;
function start(data) {
  if (booted) return;
  booted = true;
  try { if (data && data.setId) S.setId = data.setId; } catch {}
  $("#setbtn").innerHTML = ICON.gear;
  if (IN_ONTAP) $("#exitbtn").innerHTML = ICON.back;   // Ôn Tập
  if (IN_ONTAP && window.Arena) Arena.init();   // Ôn Tập: thi đấu
  TTS.init();
  render();
  connectStore();
  connectAI();
}
/* Ôn Tập: trang này chỉ chạy trong khung của Ôn Tập (để biết con nào đang học). Mở thẳng link -> về Ôn Tập. */
if (IN_ONTAP && window.parent === window) {
  location.replace("/");
} else {
  try {
    const hot = window.claude && window.claude.hot;
    if (hot && typeof hot.snapshot === "function") hot.snapshot(() => ({ setId: S.setId }));
    if (hot && typeof hot.ready === "function") { hot.ready(start); setTimeout(() => start({}), 1500); }
    else start((hot && hot.data) || {});
  } catch { start({}); }
}
</script>
