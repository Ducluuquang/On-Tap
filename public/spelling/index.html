<!doctype html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<!-- Ôn Tập: đây là app "Vở Spelling" (bản gốc ở thư mục On tap\Vocab) chạy BÊN TRONG Ôn Tập, ở mục
     Bắt đầu ôn → Tiếng Anh → "Trò chơi từ vựng" (chốt 22/10/2026). Mọi chỗ sửa cho Ôn Tập đều ghi "Ôn Tập:".
     - Ôn Tập mở trang này trong khung (iframe): /spelling/index.html?child=<id con>
     - Không đăng nhập riêng: mỗi con có kho từ, lịch ôn, cài đặt riêng trên máy (khoá ontap.spelling.v1::<id con>)
     - AI gọi /api/spelling (khoá AI nằm ở máy chủ Ôn Tập); lời nhắc ôn trên lịch: /api/ics
     - Luôn dùng giao diện sáng (data-theme="light") cho hợp với Ôn Tập
     - Bỏ manifest/biểu tượng cài app: trang này không cài riêng ra màn hình chính
     - THI ĐẤU (22/10/2026): arena.css + arena.js (máy chủ /api/arena); trang này chỉ thêm vài móc ghi "Ôn Tập: thi đấu" -->
<!-- Ôn Tập: ?child=<id con>&name=<tên>&icon=<biểu tượng>&grade=<lớp> — tên + biểu tượng hiện cho các bạn cùng phòng thi -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="10 trò chơi đánh vần tiếng Anh trên bộ từ của con: gõ từ, nhập chủ đề hoặc chụp vở.">
<meta name="robots" content="noindex">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<script>window.VS_MODE = "web"; window.VS_HOST = "ontap";</script>
<title>Vở Spelling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Patrick+Hand&display=swap">
<style>
/* Layout: one-screen notebook app. Light = vở ô li paper, dark = bảng ô li chalkboard.
   Letter tiles are the hero object; mực tím (purple school ink) is the accent, bút đỏ (teacher's red pen) marks errors and grades. */
:root{
  --paper:#FBFAFF; --sheet:#FFFFFF; --panel:#F3F0FB; --line:#DDD8EF;
  --rule:rgba(98,78,196,.075); --rule-strong:rgba(98,78,196,.15); --margin:rgba(215,38,61,.28);
  --ink:#271F4D; --ink-soft:#56507C; --muted:#857FA6;
  --accent:#5A35C8; --accent-strong:#46249F; --accent-soft:#ECE6FD; --on-accent:#FFFFFF;
  --tile:#F3DCA6; --tile-edge:#D2AE62; --tile-ink:#3A2810; --slot:#E9E4F7;
  --red:#D3243B; --on-red:#FFFFFF; --red-soft:#FDE7EA; --green:#18865A; --green-soft:#E1F4EA; --yellow:#D9961C; --yellow-soft:#FBF0D9;
  --shadow:0 1px 2px rgba(39,31,77,.06),0 6px 18px rgba(39,31,77,.07);
  --font-display:"Patrick Hand","Segoe Print","Chalkboard SE",cursive;
  --font-body:"Be Vietnam Pro",system-ui,"Segoe UI",Roboto,sans-serif;
  --font-word:"Andika","Be Vietnam Pro",system-ui,sans-serif;
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#16231E; --sheet:#1C2C26; --panel:#22352E; --line:#30483F;
  --rule:rgba(226,240,232,.035); --rule-strong:rgba(226,240,232,.075); --margin:rgba(255,128,140,.22);
  --ink:#F0F3EC; --ink-soft:#C2CDC5; --muted:#8FA198;
  --accent:#C4B3FF; --accent-strong:#D8CCFF; --accent-soft:rgba(196,179,255,.14); --on-accent:#1D1440;
  --tile:#E8D19C; --tile-edge:#AE8B47; --tile-ink:#2C1F0D; --slot:#2B4239;
  --red:#FF8591; --on-red:#2B0B12; --red-soft:rgba(255,133,145,.14); --green:#72DBA6; --green-soft:rgba(114,219,166,.13); --yellow:#F1C45E; --yellow-soft:rgba(241,196,94,.14);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#16231E; --sheet:#1C2C26; --panel:#22352E; --line:#30483F;
  --rule:rgba(226,240,232,.035); --rule-strong:rgba(226,240,232,.075); --margin:rgba(255,128,140,.22);
  --ink:#F0F3EC; --ink-soft:#C2CDC5; --muted:#8FA198;
  --accent:#C4B3FF; --accent-strong:#D8CCFF; --accent-soft:rgba(196,179,255,.14); --on-accent:#1D1440;
  --tile:#E8D19C; --tile-edge:#AE8B47; --tile-ink:#2C1F0D; --slot:#2B4239;
  --red:#FF8591; --on-red:#2B0B12; --red-soft:rgba(255,133,145,.14); --green:#72DBA6; --green-soft:rgba(114,219,166,.13); --yellow:#F1C45E; --yellow-soft:rgba(241,196,94,.14);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  margin:0; color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.55;
  background-color:var(--paper);
  background-image:linear-gradient(var(--rule-strong) 1px,transparent 1px),linear-gradient(90deg,var(--rule-strong) 1px,transparent 1px),linear-gradient(var(--rule) 1px,transparent 1px);
  background-size:32px 32px,32px 32px,100% 8px;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:0 48px}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.topbar .in{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:10px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.brand .t{font-family:var(--font-display);font-size:1.7rem;line-height:1;color:var(--accent);white-space:nowrap}
.logo{width:34px;height:36px;border-radius:7px;background:var(--tile);color:var(--tile-ink);box-shadow:inset 0 -4px 0 var(--tile-edge);display:grid;place-items:center;font-family:var(--font-word);font-weight:700;font-size:1.2rem;padding-bottom:3px;flex:none}
.spacer{flex:1}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--sheet);display:grid;place-items:center;color:var(--ink-soft)}
.iconbtn:hover{color:var(--accent);border-color:var(--accent)}
.iconbtn svg{width:20px;height:20px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--panel);color:var(--ink-soft);border:1px solid var(--line);white-space:nowrap}
.pill.warn{background:var(--yellow-soft);color:var(--ink);border-color:transparent}
.pill.weak{background:var(--red-soft);color:var(--red);border-color:transparent}
.pill.ok{background:var(--green-soft);color:var(--green);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}

/* ---------- Buttons & fields ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--sheet);font-weight:600;font-size:.95rem;color:var(--ink);transition:transform .08s ease,background .15s ease}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-strong);color:var(--on-accent)}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-soft)}
.btn.ghost:hover{color:var(--accent)}
.btn.sm{min-height:36px;padding:0 12px;font-size:.86rem;border-radius:9px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:18px;height:18px;flex:none}
.field{display:grid;gap:6px}
.field label,.lbl{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.inp,textarea.inp,select.inp{width:100%;min-height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--sheet);padding:10px 14px;font-size:1rem;outline:none}
.inp:focus{border-color:var(--accent)}
textarea.inp{min-height:150px;resize:vertical;font-family:var(--font-word);font-size:1.05rem;line-height:1.6}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 14px;font-weight:600;font-size:.9rem;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--sheet);color:var(--accent);box-shadow:var(--shadow)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.85rem}
h1,h2,h3{margin:0;text-wrap:balance}
.hand{font-family:var(--font-display);font-weight:400}

/* ---------- Letter tiles ---------- */
.tiles{--t:clamp(22px,calc((min(100vw,620px) - 92px) / var(--n,6) - 5px),54px);display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.tile{width:var(--t);height:calc(var(--t) * 1.1);border-radius:calc(var(--t) * .16);background:var(--tile);color:var(--tile-ink);box-shadow:inset 0 -4px 0 var(--tile-edge),0 1px 2px rgba(0,0,0,.12);display:grid;place-items:center;font-family:var(--font-word);font-weight:700;font-size:calc(var(--t) * .58);line-height:1;padding-bottom:3px;border:0;user-select:none;flex:none;transition:transform .12s ease,opacity .15s ease}
button.tile:hover{transform:translateY(-2px)}
.tile.slot{background:var(--slot);box-shadow:inset 0 2px 0 rgba(0,0,0,.06);border:2px dashed color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent)}
.tile.slot.cur{border-style:solid;border-color:var(--accent)}
.tile.fixed{background:transparent;box-shadow:none;width:calc(var(--t) * .45)}
.tile.used{opacity:.18;pointer-events:none}
.tile.good{background:var(--green-soft);box-shadow:inset 0 -4px 0 var(--green);color:var(--green)}
.tile.bad{background:var(--red-soft);box-shadow:inset 0 -4px 0 var(--red);color:var(--red)}
.tile.ghost{opacity:.35}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--font-word);font-size:.98rem;padding:3px 10px;border-radius:7px;background:var(--tile);color:var(--tile-ink);box-shadow:inset 0 -3px 0 var(--tile-edge);padding-bottom:5px}
.chip.weak{outline:2px solid var(--red);outline-offset:1px}
.word{font-family:var(--font-word)}

/* ---------- Home ---------- */
.home{display:grid;gap:22px;padding-top:20px}
@media (min-width:900px){.home{grid-template-columns:340px 1fr;align-items:start}}
.setcard{background:var(--sheet);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px 18px 18px 26px;position:relative;overflow:hidden;min-width:0}
.setcard::before{content:"";position:absolute;left:12px;top:0;bottom:0;width:2px;background:var(--margin)}
.setcard .name{font-family:var(--font-display);font-size:2rem;line-height:1.1;color:var(--ink);margin:4px 0 6px;overflow-wrap:anywhere}
.setcard .meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.setcard .chips{max-height:180px;overflow:auto;padding:2px}
.setcard .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.toggle{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:.9rem;color:var(--ink-soft);cursor:pointer;user-select:none}
.toggle input{appearance:none;width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--sheet);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.toggle input:checked{background:var(--accent)}
.toggle input:checked::after{left:21px}
.games h2{font-family:var(--font-display);font-size:1.8rem;font-weight:400;margin-bottom:12px;color:var(--ink)}
.ggrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.ggrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1180px){.ggrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.gcard{display:flex;flex-direction:column;align-items:stretch;gap:8px;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:12px 12px 14px;min-width:0;transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease}
.gcard:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:var(--shadow)}
.gcard[disabled]{opacity:.5;pointer-events:none}
.gcard .art{height:66px;border-radius:10px;background:var(--panel);display:flex;align-items:center;justify-content:center;gap:4px;overflow:hidden;position:relative}
.gcard .art .tiles{--t:24px;gap:3px}
.gcard .gt{font-weight:700;font-size:1rem;line-height:1.25}
.gcard .ge{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.gcard .gd{font-size:.82rem;color:var(--ink-soft);line-height:1.4}
.gcard .best{margin-top:auto;font-size:.78rem;color:var(--red);font-family:var(--font-display);font-size:1.05rem}
.gcard.wide{grid-column:span 2}
.ctx-art{font-family:var(--font-word);font-weight:700;font-size:1.1rem;color:var(--ink);padding:0 12px;text-align:center;line-height:1.4}
/* Words in context: the sentence, and a gap with one slot per letter */
.ctxwrap{width:100%;display:grid;gap:6px;justify-items:center}
.ctx{margin:0;font-family:var(--font-word);font-size:clamp(1.15rem,4.4vw,1.5rem);line-height:2.05;color:var(--ink);max-width:34ch;text-wrap:pretty;overflow-wrap:anywhere}
.ctx-meta{font-size:.85rem;color:var(--muted);font-weight:600;min-height:1.3em}
.ctx-meta b{color:var(--accent);font-family:var(--font-word);font-size:1.05rem}
.ctx-wait{display:inline-flex;font-family:var(--font-body);font-size:.95rem;line-height:1.4}
.gap{display:inline-flex;flex-wrap:wrap;gap:0 .45em;margin:0 .12em;vertical-align:-.28em}
.gw{display:inline-flex;gap:.1em;align-items:flex-end}
.gw i{font-style:normal;display:inline-block;width:.7em;height:1.3em;line-height:1.3em;border-bottom:.13em solid color-mix(in srgb,var(--accent) 50%,transparent);text-align:center;font-weight:700;color:var(--accent)}
.gw i.on{border-bottom-color:var(--accent)}
.gw b{font-weight:700;line-height:1.3em;color:var(--ink-soft)}
.gap.long .gw i{width:.56em}
.gap.good .gw i{color:var(--green);border-bottom-color:var(--green)}
.gap.bad .gw i{color:var(--red);border-bottom-color:var(--red)}
.ctx-art .gap{vertical-align:-.3em}
/* Formal vs informal: casual words look handwritten, formal ones look printed */
.reg-art{display:flex;align-items:center;gap:10px}
.reg-art .ri{font-family:var(--font-word);font-weight:700;font-size:1rem;background:var(--tile);color:var(--tile-ink);box-shadow:inset 0 -3px 0 var(--tile-edge);padding:3px 10px 6px;border-radius:8px;transform:rotate(-4deg)}
.reg-art .rf{font-family:var(--font-display);font-size:1.15rem;background:var(--sheet);color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:2px 12px}
.reg-art .arr{color:var(--muted);font-size:1.1rem}
.regq{display:grid;gap:10px;justify-items:center;width:100%}
.regq:empty{display:none}
.regw{font-family:var(--font-word);font-weight:700;font-size:clamp(1.8rem,7vw,2.4rem);line-height:1.15;color:var(--ink);overflow-wrap:anywhere}
.regex{font-size:1.05rem;color:var(--ink-soft);max-width:42ch;line-height:1.5}
.regex mark,.rp .rex mark{background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:4px;padding:0 3px}
.regarea{display:grid;gap:12px;justify-items:center;width:100%}
.regbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:520px}
.regbtns .opt{display:grid;gap:2px;place-content:center;font-family:var(--font-body);font-size:1.15rem}
.regbtns .opt small{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.reglegend{margin:0;font-size:.8rem;color:var(--muted);max-width:44ch}
.regbtns .opt[disabled]{cursor:default}
.regbtns .opt.good small{color:var(--green)}
.pairline{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:center;gap:2px 12px;width:100%;max-width:520px;padding:10px 14px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.pairline .tag{width:100%;text-align:center;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pairline .rpw.inf{font-family:var(--font-word);font-weight:700;font-size:1.35rem}
.pairline .rpw.fml{font-family:var(--font-display);font-size:1.5rem}
.pairline .rvi{padding:0}
.regpair{display:grid;gap:10px;width:100%;max-width:560px;text-align:left}
.rp{display:grid;gap:4px;justify-items:start;border:1px solid var(--line);border-radius:12px;padding:10px 14px 12px;background:var(--panel)}
.rp.shown{border-color:var(--accent)}
.rp .tag{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rpw{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:0;color:var(--ink)}
.rpw svg{width:18px;height:18px;color:var(--accent)}
.rp.inf .rpw{font-family:var(--font-word);font-weight:700;font-size:1.35rem}
.rp.fml .rpw{font-family:var(--font-display);font-size:1.5rem}
.rp .rex{border:0;background:none;padding:0;text-align:left;font-family:var(--font-body);font-size:.95rem;color:var(--ink-soft);line-height:1.5;cursor:pointer}
@media (max-width:520px){.ghead h1.long{font-size:1.32rem}.page-h h1.long{font-size:1.5rem}}
.rvi{font-size:.92rem;color:var(--ink-soft);padding:0 4px}
.empty{border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:left;background:var(--sheet)}
.empty p{margin:6px 0 14px;color:var(--ink-soft)}
.banner{margin-top:14px;padding:10px 14px;border-radius:10px;background:var(--yellow-soft);font-size:.86rem;color:var(--ink)}

/* ---------- Sheets (sets / create) ---------- */
.page{padding-top:18px;display:grid;gap:16px;max-width:760px;margin:0 auto}
.page-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.page-h h1{font-family:var(--font-display);font-weight:400;font-size:2rem;flex:1;min-width:180px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px;min-width:0}
.setlist{display:grid;gap:10px}
.setrow{display:flex;gap:12px;align-items:center;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:12px 12px 12px 16px;min-width:0}
.setrow.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.setrow .main{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left}
.setrow .nm{font-weight:700;font-size:1.05rem;overflow-wrap:anywhere}
.setrow .sub{font-size:.82rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.rev{display:grid;gap:8px}
.revrow{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1.2fr) 36px;gap:8px;align-items:center}
.revrow .emo{grid-column:1;grid-row:1}.revrow .w{grid-column:2;grid-row:1}.revrow .vi{grid-column:3;grid-row:1}.revrow .x{grid-column:4;grid-row:1}
@media (max-width:520px){.revrow{grid-template-columns:30px minmax(0,1fr) 34px;row-gap:6px;padding-bottom:8px;border-bottom:1px dashed var(--line)}.revrow .emo{grid-column:1;grid-row:1 / span 2}.revrow .w{grid-column:2;grid-row:1}.revrow .vi{grid-column:2;grid-row:2}.revrow .x{grid-column:3;grid-row:1}}
.revrow .emo{font-size:1.4rem;text-align:center}
.revrow .inp{min-height:40px;padding:6px 10px;font-size:.95rem}
.revrow .w{font-family:var(--font-word);font-weight:700;font-size:1.05rem}
.revrow .x{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--sheet);color:var(--muted);display:grid;place-items:center}
.revrow .x:hover{color:var(--red);border-color:var(--red)}
.fixnote{grid-column:2 / -1;grid-row:3;font-size:.8rem;color:var(--ink-soft);margin-top:-2px}
.working{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:.92rem}
.dots{display:inline-flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:bob 1s infinite ease-in-out}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-4px);opacity:1}}
.note{font-size:.85rem;color:var(--ink-soft);background:var(--panel);border-radius:10px;padding:10px 12px}
.err{font-size:.88rem;color:var(--red);background:var(--red-soft);border-radius:10px;padding:10px 12px}
.photo-prev{max-height:220px;border-radius:10px;border:1px solid var(--line);display:block}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;border-radius:12px;background:var(--red-soft)}

/* ---------- Game shell ---------- */
.game{max-width:720px;margin:0 auto;padding-top:12px;display:grid;gap:14px}
.ghead{display:flex;align-items:center;gap:10px}
.ghead h1{font-family:var(--font-display);font-weight:400;font-size:1.7rem;line-height:1.1;flex:1;min-width:0}
.hud{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink-soft);font-size:.92rem;white-space:nowrap}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s ease}
.stage{background:var(--sheet);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:22px 18px;display:grid;gap:18px;justify-items:center;text-align:center;min-width:0;position:relative}
.clue{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.clue .emo{font-size:2.6rem;line-height:1}
.clue .vi{font-size:1.25rem;font-weight:600;color:var(--ink)}
.ex{font-size:.95rem;color:var(--ink-soft);font-style:italic;max-width:46ch}
.speak{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.bigspeak{width:84px;height:84px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 6px 0 var(--accent-strong)}
.bigspeak:active{transform:translateY(3px);box-shadow:0 3px 0 var(--accent-strong)}
.bigspeak svg{width:38px;height:38px}
.answer{display:flex;gap:8px;width:100%;max-width:440px}
.answer .inp{flex:1;min-width:0;font-family:var(--font-word);font-size:1.5rem;font-weight:700;text-align:center;letter-spacing:.04em;min-height:56px}
.answer .inp.good{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.answer .inp.bad{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.fb{min-height:1.6em;font-family:var(--font-display);font-size:1.5rem;line-height:1.2}
.fb.good{color:var(--green)} .fb.bad{color:var(--red)}
.diff{display:grid;gap:4px;justify-items:center;font-family:var(--font-word);font-size:1.4rem;font-weight:700;letter-spacing:.05em}
.diff .lab{font-family:var(--font-body);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.diff s{color:var(--red);text-decoration-thickness:2px}
.diff .miss{color:var(--red)}
.diff u{color:var(--green);text-decoration-thickness:3px;text-underline-offset:4px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:520px}
.bank .tile{--t:clamp(38px,11vw,50px)}
.kbd{display:grid;gap:6px;width:100%;max-width:520px}
.kbd .kr{display:flex;gap:5px;justify-content:center}
.kbd button{flex:1;max-width:46px;min-width:0;height:48px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-family:var(--font-word);font-weight:700;font-size:1.15rem;text-transform:lowercase;padding:0}
.kbd button.wide{max-width:84px;flex:1.6;font-family:var(--font-body);font-size:.8rem;text-transform:none}
.kbd button.k-good{background:var(--green);color:var(--sheet);border-color:var(--green)}
.kbd button.k-near{background:var(--yellow);color:var(--sheet);border-color:var(--yellow)}
.kbd button.k-no{background:var(--line);color:var(--muted);opacity:.6}
.kbd button[disabled]{pointer-events:none}
.shake{animation:shake .35s ease}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.pop{animation:pop .4s ease}
@keyframes pop{40%{transform:scale(1.08)}}
.cover{width:100%;max-width:440px;min-height:90px;border-radius:14px;display:grid;place-items:center;background:repeating-linear-gradient(var(--panel) 0 7px,var(--line) 7px 8px);border:1px solid var(--line);color:var(--muted);font-family:var(--font-display);font-size:1.3rem}
.countdown{width:100%;max-width:440px;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.countdown i{display:block;height:100%;background:var(--yellow);width:100%}

/* Choose */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;max-width:520px}
.opt{min-height:64px;border-radius:12px;border:2px solid var(--line);background:var(--sheet);font-family:var(--font-word);font-weight:700;font-size:1.35rem;padding:6px 8px;overflow-wrap:anywhere}
.opt:hover{border-color:var(--accent)}
.opt.good{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.opt.bad{border-color:var(--red);background:var(--red-soft);color:var(--red);text-decoration:line-through}

/* Word search */
.ws-wrap{width:100%;display:grid;gap:14px;justify-items:center}
.wsgrid{--c:clamp(26px,calc((min(100vw,560px) - 70px) / var(--n)),44px);display:grid;grid-template-columns:repeat(var(--n),var(--c));gap:2px;touch-action:none;user-select:none;-webkit-user-select:none;padding:6px;border-radius:12px;background:var(--panel)}
.wsgrid .c{width:var(--c);height:var(--c);display:grid;place-items:center;font-family:var(--font-word);font-weight:700;font-size:calc(var(--c) * .55);border-radius:6px;background:var(--sheet);color:var(--ink);position:relative}
.wsgrid .c.sel{background:var(--accent);color:var(--on-accent)}
.wsgrid .c.start{outline:2px solid var(--accent);outline-offset:-2px}
.wsgrid .c.found{background:var(--green-soft);color:var(--green)}
.wsgrid .c.reveal{background:var(--red-soft);color:var(--red)}
.wslist{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:560px}
.wslist span{font-family:var(--font-word);font-weight:700;padding:4px 10px;border-radius:8px;background:var(--panel);font-size:1rem}
.wslist span.done{background:var(--green-soft);color:var(--green);text-decoration:line-through}
.wslist span.miss{background:var(--red-soft);color:var(--red)}

/* Memory */
.mem{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;max-width:560px}
@media (min-width:600px){.mem{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{perspective:800px;border:0;background:none;padding:0;aspect-ratio:4/5;max-width:100%}
.card .in{position:relative;width:100%;height:100%;transition:transform .35s ease;transform-style:preserve-3d}
.card.up .in,.card.done .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;padding:6px;text-align:center}
.card .b{background:var(--accent);background-image:repeating-linear-gradient(0deg,transparent 0 7px,rgba(255,255,255,.14) 7px 8px),repeating-linear-gradient(90deg,transparent 0 31px,rgba(255,255,255,.2) 31px 32px);color:var(--on-accent);font-family:var(--font-display);font-size:2rem}
.card .f{transform:rotateY(180deg);background:var(--sheet);border:2px solid var(--line);overflow-wrap:anywhere}
.card .f.w{font-family:var(--font-word);font-weight:700;font-size:clamp(.95rem,3.6vw,1.25rem);background:var(--tile);color:var(--tile-ink);border-color:var(--tile-edge)}
.card .f.m{font-size:.9rem;font-weight:600;line-height:1.25}
.card .f.m .e{font-size:1.7rem;display:block}
.card.done .f{border-color:var(--green);box-shadow:0 0 0 2px var(--green-soft)}
.card.done .f.w{border-color:var(--green)}

/* Rain */
.rain{position:relative;width:100%;height:clamp(200px,36vh,420px);border-radius:14px;overflow:hidden;background:var(--panel);background-image:linear-gradient(var(--rule-strong) 1px,transparent 1px),linear-gradient(var(--rule) 1px,transparent 1px);background-size:100% 32px,100% 8px;border:1px solid var(--line)}
.rain .drop{position:absolute;top:0;left:0;transform:translate(var(--x),var(--y));padding:6px 12px 8px;border-radius:9px;background:var(--tile);color:var(--tile-ink);box-shadow:inset 0 -3px 0 var(--tile-edge);font-family:var(--font-word);font-weight:700;font-size:1.15rem;white-space:nowrap;will-change:transform}
.rain .drop.m{font-family:var(--font-body);font-size:.95rem;background:var(--sheet);color:var(--ink);box-shadow:inset 0 -3px 0 var(--line),0 1px 2px rgba(0,0,0,.08)}
.rain .drop.hit{background:var(--green);color:var(--sheet);box-shadow:none;transition:opacity .4s,transform .4s;opacity:0}
.rain .floor{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--red);opacity:.5}
.rain .drop.lost{background:var(--red-soft);color:var(--red);box-shadow:none}
.lives{display:inline-flex;gap:4px;color:var(--red);font-size:1.1rem;letter-spacing:2px}

/* Wordle */
.wdl{display:grid;gap:6px}
.wdl .wr{display:flex;gap:6px;justify-content:center}
.wdl .wc{--t:clamp(34px,calc((min(100vw,520px) - 60px) / var(--n) - 6px),52px);width:var(--t);height:var(--t);border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--font-word);font-weight:700;font-size:calc(var(--t) * .55);background:var(--sheet)}
.wdl .wc.f{border-color:var(--ink-soft)}
.wdl .wc.g{background:var(--green);border-color:var(--green);color:var(--sheet)}
.wdl .wc.y{background:var(--yellow);border-color:var(--yellow);color:var(--sheet)}
.wdl .wc.x{background:var(--muted);border-color:var(--muted);color:var(--sheet)}


/* ---------- Result (bài làm) ---------- */
.paper{background:var(--sheet);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;position:relative}
.paper::before{content:"";position:absolute;left:22px;top:0;bottom:0;width:2px;background:var(--margin)}
.mark{display:grid;grid-template-columns:120px 1fr;border-bottom:1.5px solid var(--line)}
.mark>div{padding:12px 16px 14px 36px}
.mark>div+div{padding-left:16px;border-left:1.5px solid var(--line)}
.mark .lab{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--font-display);color:var(--red);font-size:3.2rem;line-height:1;display:inline-grid;place-items:center;width:84px;height:84px;margin-top:6px;border:2.5px solid var(--red);border-radius:50% 46% 52% 48%;transform:rotate(-6deg)}
.loiphe{font-family:var(--font-display);color:var(--red);font-size:1.45rem;line-height:1.3;margin-top:6px}
.reslist{list-style:none;margin:0;padding:10px 16px 16px 36px;display:grid;gap:2px}
.reslist li{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.reslist .ic{font-weight:700;width:18px;flex:none}
.reslist .ic.ok{color:var(--green)} .reslist .ic.no{color:var(--red)} .reslist .ic.half{color:var(--yellow)}
.reslist .w{font-family:var(--font-word);font-weight:700;font-size:1.1rem}
.reslist .t{font-family:var(--font-word);color:var(--red);text-decoration:line-through}
.reslist .v{color:var(--muted);font-size:.86rem}
.res-acts{display:flex;gap:10px;flex-wrap:wrap;padding:0 16px 18px 36px}

/* ---------- Settings & toast ---------- */
.panel-pop{position:fixed;right:max(16px,calc((100vw - 1080px) / 2 + 16px));top:calc(64px + env(safe-area-inset-top,0px));width:min(320px,calc(100vw - 32px));background:var(--sheet);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px;display:grid;gap:14px;z-index:30}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:.9rem;font-weight:500;z-index:50;max-width:calc(100vw - 32px);box-shadow:var(--shadow)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Spaced review ---------- */
.leftcol{display:grid;gap:16px;align-content:start;min-width:0}
.revcard{background:var(--sheet);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.rc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 16px 7px 26px;background:var(--red);color:var(--on-red);font-weight:700;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;position:relative}
.rc-top::before{content:"";position:absolute;left:10px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--sheet);opacity:.85}
.rc-body{padding:14px 16px 16px;display:grid;gap:10px}
.rc-count{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.rc-num{font-family:var(--font-display);font-size:3.6rem;line-height:.85;color:var(--accent)}
.rc-unit{font-weight:600;color:var(--ink)}
.rc-title{font-family:var(--font-display);font-size:1.6rem;line-height:1.1;color:var(--ink)}
.rc-text{margin:0;color:var(--ink-soft);font-size:.92rem}
.rc-text b{color:var(--ink)}
.rc-sets{display:flex;flex-wrap:wrap;gap:6px}
.rc-sets span{font-size:.76rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);overflow-wrap:anywhere}
.srsline{display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--line);margin:0 0 5px}
.srsline span{display:block;height:100%}
.srsline .s-done{background:var(--green)}
.srsline .s-learn{background:var(--accent)}
.srsline .s-new{background:var(--line)}
.srslegend{font-size:.76rem;color:var(--muted);margin-bottom:12px;font-variant-numeric:tabular-nums}
.chip.due{position:relative}
.chip.due::after{content:"";position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--sheet)}
.chip.idiom{background:var(--sheet);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--tile-edge);font-style:italic}
.chip.adv::before{content:"+";font-weight:700;color:var(--accent);margin-right:2px}
.chip small{font-family:var(--font-body);font-size:.66rem;font-weight:700;color:var(--tile-ink);opacity:.62;margin-left:6px;font-style:normal;font-variant-numeric:tabular-nums}
.tiles.phrase{column-gap:16px;row-gap:8px}
.tword{display:inline-flex;gap:5px;flex-wrap:nowrap}
/* Schedule page */
.plan-intro p{margin:0 0 18px;color:var(--ink-soft);max-width:64ch}
.plan-intro b{color:var(--ink)}
.ladder{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;position:relative}
.ladder::before{content:"";position:absolute;left:6%;right:6%;top:17px;height:2px;background:var(--line)}
.ladder li{display:grid;justify-items:center;gap:3px;position:relative;text-align:center;min-width:0}
.ladder .node{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--sheet);border:2px solid var(--accent);color:var(--accent);font-weight:700;font-size:.8rem;font-variant-numeric:tabular-nums}
.ladder .lad-new .node{border-color:var(--line);color:var(--muted);font-size:.7rem}
.ladder .lad-done .node{border-color:var(--green);background:var(--green);color:var(--sheet)}
.ladder .cnt{font-family:var(--font-display);font-size:1.45rem;line-height:1;color:var(--ink)}
.ladder .cap{font-size:.66rem;color:var(--muted);line-height:1.2}
@media (max-width:560px){.ladder{grid-template-columns:repeat(4,minmax(0,1fr));row-gap:14px}.ladder::before{display:none}}
.plan-h{font-family:var(--font-display);font-weight:400;font-size:1.6rem;margin:6px 0 0;color:var(--ink)}
.daylist{display:grid;gap:10px}
.dayrow{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:10px;min-width:0}
.dayrow.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.dh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dl{font-weight:700}
.dc{color:var(--muted);font-size:.86rem;flex:1}
.remind .btn{text-decoration:none}
/* Add words: kinds */
.kinds{display:grid;gap:8px}
@media (min-width:620px){.kinds{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kind{display:grid;gap:4px;align-content:start;text-align:left;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--sheet);min-width:0}
.kind b{font-size:.98rem}
.kind span{font-size:.8rem;color:var(--ink-soft);line-height:1.35}
.kind.on{border-color:var(--accent);background:var(--accent-soft)}
.kind.on b{color:var(--accent)}
/* Result: next review */
.reslist .nx{margin-left:auto;font-size:.76rem;font-weight:700;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.reslist .nx.done{color:var(--green)}
.res-note{margin:4px 16px 14px 36px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);color:var(--ink);font-size:.9rem}

/* ---------- Accounts ---------- */
#storepill{display:flex;align-items:center;gap:6px;min-width:0}
.login-page{max-width:460px;padding-top:24px}
.login-card{display:grid;gap:16px;padding:22px 20px}
.lg-head{display:flex;gap:14px;align-items:flex-start}
.lg-head .logo{width:44px;height:48px;font-size:1.5rem}
.lg-head h1{font-size:2.1rem;line-height:1.05;margin:0 0 4px;color:var(--ink)}
.lg-head p{margin:0}
.lg-form{display:grid;gap:12px}
.inp.pin{letter-spacing:.3em;font-size:1.2rem}
.recent{display:grid;gap:8px}
.who{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:999px;border:1px solid var(--line);background:var(--sheet);font-weight:600;max-width:100%}
.who:hover{border-color:var(--accent)}
.ua{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:.85rem;flex:none}
.ua.big{width:40px;height:40px;font-size:1.1rem}
.userchip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:999px;border:1px solid var(--line);background:var(--sheet);font-weight:600;font-size:.86rem;max-width:150px;min-width:0}
.userchip .un{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.userchip:hover{border-color:var(--accent)}
@media (max-width:430px){.topbar:has(.userchip) .brand .t{display:none}}
.acct{display:flex;gap:12px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}
.implist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.implist li{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 12px;border-radius:10px;background:var(--panel);overflow-wrap:anywhere}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
/* Ôn Tập: trang nằm trong khung BO GÓC của Ôn Tập. Nền vở ô li chuyển sang lớp ::before của body (vẫn cuộn theo nội dung,

const TTS = {
  ok: typeof window !== "undefined" && "speechSynthesis" in window && "SpeechSynthesisUtterance" in window,
  voices: [],
  init() {
    if (!this.ok) return;
    const load = () => { try { this.voices = window.speechSynthesis.getVoices() || []; } catch { this.voices = []; } };
    load();
    try { window.speechSynthesis.addEventListener("voiceschanged", load); } catch {}
  },
  pick() {
    const want = prefs.accent, v = this.voices;
    const lang = x => String(x.lang || "").replace("_", "-");
    return v.find(x => lang(x) === want && /natural|neural|enhanced|premium|google|samantha|daniel/i.test(x.name))
      || v.find(x => lang(x) === want) || v.find(x => /^en/i.test(lang(x)));
  },
  say(text, slow) {
    if (!this.ok || !text) return false;
    try {
      const ss = window.speechSynthesis;
      ss.cancel();
      const u = new SpeechSynthesisUtterance(String(text));
      const v = this.pick();
      if (v) u.voice = v;
      u.lang = v ? v.lang : prefs.accent;
      u.rate = slow ? 0.55 : prefs.rate;
      ss.speak(u);
      return true;
    } catch { return false; }
  },
};

/* ---------- Words: cleaning, weak words, picking ---------- */
/* Words and idioms: letters, spaces, apostrophes and hyphens only; other punctuation is dropped. */
function cleanItem(o) {
  let w = String((o && o.w) || "").replace(/[’‘`´]/g, "'").replace(/["“”!?.,;:()]/g, " ").replace(/\s+/g, " ").trim();
  if (!w || /[^A-Za-z' -]/.test(w) || !/[A-Za-z]/.test(w)) return null;
  w = w.replace(/^[-' ]+|[-' ]+$/g, "");
  if (!w || w.length > 40) return null;
  const e = Array.from(String((o && o.e) || "").trim()).slice(0, 8).join("");
  const out = {
    w,
    vi: String((o && o.vi) || "").trim().slice(0, 80),
    ex: String((o && o.ex) || "").trim().slice(0, 160),
    e: /[A-Za-z0-9]/.test(e) ? "" : e,
  };
  if (o && (o.t === "idiom" || o.t === "adv")) out.t = o.t;
  return out;
}

function parseTyped(text) {
  const raw = String(text || "").replace(/\r/g, "");
  const items = /[\n,;\/\t]/.test(raw) ? raw.split(/[\n,;\/\t]+/) : (/\s[-–—]\s|[:=(]/.test(raw) ? [raw] : raw.split(/\s+/));
  const out = [], seen = new Set();
  for (let it of items) {
    it = it.trim().replace(/^\s*(\d+[.)]|[a-z]\))\s+/i, "");
    if (!it) continue;
    let w = it, vi = "";
    const m = it.match(/^(.+?)(?:\s+[-–—]+\s*|\s*[-–—]+\s+|\s*[:=]\s*|\s*\(\s*)(.+?)\)?$/);
    if (m) {
      let a = m[1].trim(), b = m[2].trim();
      const nonAscii = s => /[^\x00-\x7F]/.test(s);
      if (nonAscii(a) && !nonAscii(b)) [a, b] = [b, a];
      if (/[a-z]/i.test(a)) { w = a; vi = b; }
    }
    const c = cleanItem({ w, vi });
    if (!c) continue;
    const k = norm(c.w);
    if (seen.has(k)) continue;
    seen.add(k); out.push(c);
  }
  return out.slice(0, 200);
}

function weakSet(set) {
  const st = statsFor(set.id).words, out = new Set();
  for (const w of set.words) {
    const h = (st[norm(w.w)] && st[norm(w.w)].h) || "";
    if (!h) continue;
    const acc = [...h].filter(c => c === "1").length / h.length;
    if (h.slice(-3).includes("0") || (h.length >= 3 && acc < 0.7)) out.add(norm(w.w));
  }
  return out;
}

function pickWords(set, n, filter, onlyWeak) {
  let words = set.words.filter(w => !filter || filter(w));
  const weak = weakSet(set), st = statsFor(set.id).words, today = dayNum();
  if (onlyWeak) words = words.filter(w => weak.has(norm(w.w)));
  const keyed = words.map(w => {
    const k = norm(w.w), s = srsStatus(st[k], today);
    const wt = weak.has(k) || s === "due" ? 3 : s === "new" ? 2 : 1;
    return { w, key: Math.pow(Math.random(), 1 / wt) };
  });
  keyed.sort((a, b) => b.key - a.key);
  return keyed.slice(0, n).map(x => x.w);
}

  { id: "top", group: "intl", label: "Cao nhất · SAT, GRE", who: "learner",
    desc: "the most advanced learners, preparing for the SAT or GRE or reading literature and academic journals: rare, sophisticated words of the kind found on GRE word lists; skip anything a C1 learner would already know" },
];
const LEVEL_GROUPS = [["school", "Theo lớp ở trường"], ["intl", "Nâng cao · chuẩn quốc tế"]];
const LINE_FMT = '{"w":"elephant","vi":"con voi","ex":"The elephant has a long trunk.","e":"🐘"}';

/* kind: "common" (the most common words, easiest first), "advanced" (harder words) or "idioms".
   avoid: words the list already has, so a follow-up batch only brings new ones. */
const KIND_ASK = {
  common: "different English words for this topic at these learners' level, choosing the most common and useful ones first",
  advanced: "more advanced English words for this topic: less common, richer vocabulary that a strong learner at this level could learn next",
  idioms: "English idioms or fixed expressions related to this topic that these learners can understand and use",
};
function promptTopic(topic, level, count, kind, avoid) {
  kind = KIND_ASK[kind] ? kind : "common";
  const idioms = kind === "idioms", kids = !!level.kids;
  const ask = KIND_ASK[kind] + (kids && kind === "advanced" ? ", still suitable for children" : "") + (kids && idioms ? " (common ones)" : "");
  const lines = [
    kids ? "You are helping a Vietnamese parent build an English spelling list for a " + level.who + "."
      : "You are helping a Vietnamese " + level.who + " build an English vocabulary and spelling list.",
    "Topic (may be written in Vietnamese or English): " + JSON.stringify(topic),
    "Learners: " + level.desc + ".",
    (idioms ? "List up to " : "List exactly ") + count + " " + ask + ".",
    idioms
      ? '- "w" is the idiom exactly as native speakers say it, e.g. "a piece of cake" or "sour grapes": lowercase, no ending punctuation, and no added "a" or "the" unless it is part of the idiom. Only real, well-known idioms; if this topic has fewer good ones, list fewer.'
      : "- Use correct standard spelling (American English) with plain letters a-z (cafe, naive, not café, naïve). Single words are best; use a two-word phrase only when it is the normal name of the thing.",
    "- Lowercase, except words that are always capitalized (days, months, countries).",
    idioms ? '- "vi" is a short, natural Vietnamese meaning of the idiom.'
      : kids ? '- "vi" is a short, natural Vietnamese meaning (1-4 words).'
      : '- "vi" is a short, natural Vietnamese meaning (1-6 words) for the sense used in this topic.',
    kids ? '- "ex" is one short, simple English sentence that uses it (at most 12 words).'
      : '- "ex" is one natural English sentence that uses it the way it is typically used (at most 18 words).',
    '- "e" is one emoji that pictures it, or "" if none fits.',
  ];
  if (avoid && avoid.length) lines.push("- The list already has these, so do not repeat any of them: " + avoid.join(", "));
  lines.push(
    "Write one JSON object per line and nothing else: no numbering, no code fences, no comments.",
    'First line: {"name":"<short name for this list, 1-4 words, in the language the topic was written in>"}',
    "Then one line per item, like:",
    idioms ? '{"w":"a piece of cake","vi":"dễ như ăn bánh","ex":"The spelling test was a piece of cake.","e":"🍰"}' : LINE_FMT,
  );
  return lines.join("\n");
}
function promptEnrich(items) {
  return [
    "A Vietnamese learner (or a parent, for a child) typed this English spelling list. For every item below, in the same order, write one JSON object per line and nothing else (no numbering, no code fences):",
    '{"orig":"<the item exactly as typed>","w":"<the word with correct standard English spelling>","vi":"<short Vietnamese meaning, 1-4 words>","ex":"<one short simple English sentence using the word, max 12 words>","e":"<one emoji picturing the word, or empty>"}',
    "Rules:",
    '- If an item is a clear misspelling of an English word, put the correct spelling in "w". Otherwise copy it unchanged into "w" (keep capital letters of proper nouns). Use plain letters a-z (naive, not naïve).',
    '- If a Vietnamese meaning is given after "|", use it as "vi".',
    '- Start with one extra line: {"name":"<short name for this list, 1-4 words>"}',
    "Items:",
    ...items.map((it, i) => (i + 1) + ". " + it.w + (it.vi ? " | " + it.vi : "")),
  ].join("\n");
}
function promptPhoto() {
  return [
    "This photo shows a page from a Vietnamese learner's English notebook, worksheet or textbook (often a child's). Find the English vocabulary being learned on this page: word lists, vocabulary boxes, words written with Vietnamese meanings. Skip instructions, page numbers, people's names and full sentences.",
    "Write one JSON object per line and nothing else (no numbering, no code fences).",
    'First line: {"name":"<short name for this list, e.g. the unit or lesson title, max 5 words>"}',
    "Then one line per word (at most 30), like:",
    LINE_FMT,
    "- Use the Vietnamese meaning printed on the page when there is one; otherwise write a short natural one.",
    "- Fix obvious handwriting or OCR mistakes so every word has its correct standard spelling.",
    '- "ex" is one short simple English sentence using the word (max 10 words); "e" is one emoji or "".',
    'If the photo has no English words to learn, write only: {"error":"no_words"}',
  ].join("\n");
}
/* "Từ theo ngữ cảnh": a fresh sentence per word, written so the word can be hidden and still guessed. */
function promptContext(items, level) {
  const kids = !!level.kids;
  return [
    "You are writing fill-in-the-blank sentences for an English vocabulary game for a Vietnamese learner. The game hides the item and the learner must guess it from the sentence and type it.",
    "Learners: " + level.desc + ".",
    "For every item below, in the same order, write one JSON object per line and nothing else (no numbering, no code fences):",
    '{"w":"<the item exactly as given>","ex":"<one English sentence>"}',
    "Rules for each sentence:",
    "- Use the item exactly once, written exactly as given: same spelling and same form (do not add -s, -ed or -ing, do not change the words of an idiom).",
    "- Give strong context clues, so that a learner who knows the item can tell it is the only natural fit for the gap: what it does, where it is found, what it looks or feels like, or when people use it.",
    "- Do not define it word for word, and do not put a synonym or a translation right next to it.",
    "- Use the sense given by the Vietnamese meaning, when there is one.",
    kids ? "- Short, simple and concrete, at most 12 words." : "- Natural English at these learners' level, at most 22 words.",
    "Items:",
    ...items.map((it, i) => (i + 1) + ". " + it.w + (it.vi ? "  (meaning: " + it.vi + ")" : "")),
  ].join("\n");
}
/* "Trang trọng hay thân mật": pairs with the same meaning, one informal and one formal. */
function promptRegister(topic, words, count, level) {
  const kids = !!level.kids;
  return [
    'You are making a "formal or informal?" game for a Vietnamese learner of English.',
    "Topic of the learner's word list: " + JSON.stringify(topic),
    "Learners: " + level.desc + ".",
    words.length ? "Words in the list (use one when it has a natural formal or informal partner): " + words.join(", ") : "",
    "Write " + count + " pairs of English expressions that mean the same thing: one informal (what friends and family say) and one formal (what you write in an essay, an exam or an official letter).",
    kids
      ? "These are young learners: use simple, clear pairs such as mom / mother, kids / children, thanks / thank you, TV / television, a lot of / many."
      : "Good pairs are like buy / purchase, find out / discover, a lot of / a great deal of, cut down on / reduce. Choose pairs that are useful for this topic and level.",
    "Write one JSON object per line and nothing else (no numbering, no code fences):",
    '{"inf":"<informal expression>","fml":"<formal expression>","vi":"<short Vietnamese meaning>","exi":"<casual sentence>","exf":"<formal sentence>"}',
    "Rules:",
    "- Each expression is a word or a short phrase (at most 4 words) in plain letters a-z, lowercase unless it is always capitalized.",
    "- The difference in register must be clear and the two must really mean the same in these sentences.",
    '- "exi" is a natural, casual sentence using the informal expression exactly as written; "exf" is a formal sentence using the formal expression exactly as written.',
    kids ? "- Short, simple sentences, at most 10 words." : "- Sentences of at most 18 words.",
    "- No rude slang, nothing unsuitable for children, and no expression used twice.",
  ].filter(Boolean).join("\n");
}

/* ---------- AI ----------
   In Claude (artifact): asks Claude on the viewer's account through the `sample` capability.
   On the web (Vercel): posts to /api/ai, which keeps the Anthropic API key on the server. */
const AI = { ask: null, sample: null, images: null, denied: false, checked: false, web: APP_MODE === "web", webIssue: "" };
const AI_URL = IN_ONTAP ? "/api/spelling" : "/api/ai";   // Ôn Tập: /api/ai của Ôn Tập làm việc khác, nên Vở Spelling dùng /api/spelling
async function connectAI() {
  if (AI.web) await connectWebAI();
  else {
    try {
      const s = window.claude && typeof window.claude.use === "function" ? await window.claude.use("sample") : null;
      if (s) {
        AI.sample = s; AI.ask = artifactAsk;
        const lim = await s.limits().catch(() => null);
        AI.images = lim && lim.images ? lim.images : null;
      }
    } catch {}
  }
  AI.checked = true;
  if (S.view === "create") renderCreate();
}
const aiReady = () => !!AI.ask && !AI.denied;

function artifactAsk(req, { images, signal, onText }) {
  const level = LEVELS.find(l => l.id === req.level) || LEVELS[1];
  const prompt = req.mode === "topic" ? promptTopic(req.topic, level, req.count, req.kind, req.avoid)
    : req.mode === "enrich" ? promptEnrich(req.items)
    : req.mode === "context" ? promptContext(req.items, level)
    : req.mode === "register" ? promptRegister(req.topic || "everyday English", req.words || [], req.count || 8, level) : promptPhoto();
  const opts = { signal, modelTier: "default", cache: false, onText };
  if (images) opts.images = images;
  return AI.sample(prompt, opts);
}

async function connectWebAI() {
  try {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 8000);
    const r = await fetch(AI_URL, { cache: "no-store", signal: ctl.signal });
    clearTimeout(t);
    const j = r.ok ? await r.json().catch(() => null) : null;
    if (j && j.ok && j.ai) {
      AI.ask = webAsk;
      AI.images = { maxCount: 1, maxInputBytes: 30 * 1024 * 1024, mediaTypes: ["image/*"] };
    } else AI.webIssue = j && j.ok ? "no_key" : "no_server";
  } catch { AI.webIssue = "no_server"; }
}

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => resolve({ img, url });
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("decode")); };
    img.src = url;
  });
}
/* Phone photos are several MB; send a JPEG of at most 1568 px on the long side. */
async function shrinkImage(file) {
  let loaded;
  try { loaded = await loadImage(file); } catch { throw { code: "image_rejected" }; }
  const { img, url } = loaded;
  const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  if (!w || !h) { URL.revokeObjectURL(url); throw { code: "image_rejected" }; }
  const s = Math.min(1, 1568 / Math.max(w, h));
  const cv = document.createElement("canvas");
  cv.width = Math.max(1, Math.round(w * s)); cv.height = Math.max(1, Math.round(h * s));
  const cx = cv.getContext("2d");
  cx.fillStyle = "#ffffff"; cx.fillRect(0, 0, cv.width, cv.height);
  cx.drawImage(img, 0, 0, cv.width, cv.height);
  URL.revokeObjectURL(url);
  const du = cv.toDataURL("image/jpeg", 0.85);
  return { media_type: "image/jpeg", data: du.slice(du.indexOf(",") + 1) };
}

async function webAsk(req, { images, signal, onText }) {
  const body = Object.assign({}, req);
  if (images && images[0]) body.image = await shrinkImage(images[0]);
  if (signal && signal.aborted) throw { code: "cancelled" };
  let r;
  try {
    const headers = { "Content-Type": "application/json" };
    if (ACC.token) headers.Authorization = "Bearer " + ACC.token;
    r = await fetch(AI_URL, { method: "POST", headers, body: JSON.stringify(body), signal });
  } catch {
    throw { code: signal && signal.aborted ? "cancelled" : "network" };
  }
  if (!r.ok) {
    const j = await r.json().catch(() => null);
    const code = (j && j.error) || "http_" + r.status;
    if (code === "auth" && ACC.token) sessionLost();
    throw { code };
  }
  let text = "";
  const push = d => { if (!d) return; text += d; onText({ text, delta: d }); };
  if (!r.body || !r.body.getReader) { push(await r.text()); return { text, truncated: false }; }
  const reader = r.body.getReader(), dec = new TextDecoder();
  try {
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      push(dec.decode(value, { stream: true }));
    }
    push(dec.decode());
  } catch {
    throw { code: signal && signal.aborted ? "cancelled" : "network", text };
  }
  return { text, truncated: false };
}

function aiErrMsg(e) {
  switch (String((e && e.code) || "")) {
    case "not_granted": case "sampling_disabled": case "not_declared": case "capability_disabled": case "capability_removed":

    case "rate_limited": return AI.web ? "AI đang nhận quá nhiều yêu cầu. Đợi một phút rồi thử lại." : "AI đang bận hoặc đã hết lượt dùng. Đợi vài phút rồi thử lại.";
    case "session_expired": return "Phiên đăng nhập Claude đã hết hạn. Đăng nhập lại rồi thử lại.";
    case "image_rejected": case "bad_image": return "Ảnh này không đọc được. Thử chụp lại, hoặc chọn ảnh JPG hay PNG.";
    case "images_unavailable": AI.images = null; return "Trang này chưa gửi ảnh cho AI được. Hãy gõ từ hoặc nhập chủ đề.";
    case "refused": return "AI không xử lý yêu cầu này. Thử đổi chủ đề hoặc cách viết.";
    case "invalid_json": case "empty_completion": return "AI trả lời chưa đúng định dạng. Bấm thử lại.";
    case "prompt_too_large": case "too_large": case "http_413": return "Ảnh hoặc danh sách quá lớn. Thử ảnh nhỏ hơn hoặc chia nhỏ danh sách.";
    case "no_key": return "Máy chủ chưa có khóa AI. Trên Vercel, thêm ANTHROPIC_API_KEY trong Settings → Environment Variables rồi bấm Redeploy.";
    case "bad_key": return "Khóa AI không đúng hoặc đã bị xóa. Kiểm tra lại ANTHROPIC_API_KEY trên Vercel.";
    case "no_credit": return "Tài khoản Anthropic đã hết tiền. Nạp thêm ở console.anthropic.com, mục Billing.";
    case "overloaded": case "http_503": return "AI đang quá tải. Đợi một lát rồi thử lại.";
    case "model": return "Không gọi được mô hình AI. Nếu có đặt ANTHROPIC_MODEL trên Vercel thì xóa biến đó rồi Redeploy.";
    case "http_504": return "AI trả lời quá lâu. Thử lại với ít từ hơn.";
    case "network": return "Mất kết nối mạng. Kiểm tra mạng rồi thử lại.";
    case "bad_request": return "Yêu cầu chưa hợp lệ. Kiểm tra nội dung rồi thử lại.";
    case "auth": return "Cần đăng nhập để dùng AI. Đăng nhập lại nhé.";
    case "cancelled": return "";
    default: return "Kết nối với AI bị gián đoạn. Bấm thử lại.";
  }
}

/* Streams "one JSON object per line" answers; calls onItem for word lines, onMeta for others. */
async function aiLines(req, { images, signal, onItem, onMeta }) {
  let pending = "", got = 0, streamErr = "", truncated = false;
  /* Loanwords at the top levels sometimes come with accents (café, naïve); the games need plain a–z. */
  const fold = o => req.mode === "photo" ? o : Object.assign(o, { w: String(o.w).normalize("NFD").replace(/[̀-ͯ]/g, "") });
  const item = o => { got++; onItem(fold(o)); };
  const eat = line => {
    line = line.trim().replace(/^```(?:json)?/i, "").replace(/```$/, "").trim().replace(/,\s*$/, "");
    if (!line.startsWith("{")) return;
    let o;
    try { o = JSON.parse(line); } catch { return; }
    if (!o || typeof o !== "object") return;
    if (o.__error) { streamErr = String(o.__error); return; }
    if (o.__meta) { if (o.__meta === "truncated") truncated = true; return; }
    if (o.w) item(o); else if (onMeta) onMeta(o);
  };
  const res = await AI.ask(req, {
    images, signal,
    onText: ({ delta }) => { const lines = (pending + delta).split("\n"); pending = lines.pop(); lines.forEach(eat); },
  });
  if (pending.trim()) eat(pending);
  pending = "";
  if (!got) {
    const m = String(res.text || "").match(/\[[\s\S]*\]/);
    if (m) { try { for (const o of JSON.parse(m[0])) { if (o && o.w) item(o); else if (o && onMeta) onMeta(o); } } catch {} }
  }
  if (streamErr) throw { code: streamErr };
  return { got, truncated: truncated || !!res.truncated };
}

function gameCardHtml(g, set) {
  const n = set ? set.words.filter(w => !g.filter || g.filter(w)).length : 0;
  const ok = !!set && n >= g.min;
  const best = set ? statsFor(set.id).best[g.id] : undefined;
  return `<button class="gcard${g.wide ? " wide" : ""}" type="button" data-game="${g.id}" ${ok ? "" : "disabled"}>
    <div class="art" aria-hidden="true">${g.art()}</div>
    <div><div class="ge">${esc(g.en)}</div><div class="gt">${esc(g.name)}</div></div>
    <div class="gd">${esc(set && !ok ? g.need : g.desc)}</div>
    ${best != null ? `<div class="best">Điểm cao nhất: ${fmt(best)}</div>` : ""}
  </button>`;
}

function appendRev(i) {

}
function setStatus(c, text) { c.status = text; const s = $("#c-status"); if (s) s.textContent = text; }
function replaceRev(i) {
  const row = $(`.revrow[data-i="${i}"]`);
  if (row && !row.contains(document.activeElement)) row.outerHTML = revRowHtml(S.create.words[i], i);

function setNameIfAuto(c, name) {

  c.name = String(name).trim().slice(0, 60);
  const n = $("#c-name"); if (n && document.activeElement !== n) n.value = c.name;

async function runCreate() {
  const c = S.create; c.error = "";
  if (c.mode === "type") {
    const items = parseTyped(c.text);
    if (!items.length) { c.error = "Chưa thấy từ tiếng Anh nào. Gõ các từ cách nhau bằng dấu phẩy hoặc xuống dòng."; renderCreate(); return; }
    c.words = items; c.source = "typed"; c.step = "review";
    if (!c.name) c.name = "Bộ từ " + ddmm();
    if (c.enrich && aiReady()) return runEnrich(c.words.map((_, i) => i));
    renderCreate(); return;
  }
  if (c.mode === "topic" || c.expand) {
    const topic = c.topic.trim();
    if (!topic) { c.error = "Nhập một chủ đề trước, ví dụ: Animals."; renderCreate(); return; }
    c.words = []; c.step = "review";
    if (c.expand) return runBatches(c, c.kind, c.count, `AI đang tìm ${KIND_OPTS[c.kind].label.toLowerCase()} cho chủ đề “${topic}”.`);
    c.source = "topic"; c.name = topic.charAt(0).toUpperCase() + topic.slice(1); c.nameAuto = true;
    return runBatches(c, "common", c.count, `AI đang chọn ${c.count} từ cho chủ đề “${topic}”. Thường mất 10–40 giây.`);
  }
  if (!c.file) return;
  if (AI.images && AI.images.maxInputBytes && c.file.size > AI.images.maxInputBytes) { c.error = "Ảnh quá lớn. Chụp lại hoặc chọn ảnh nhỏ hơn."; renderCreate(); return; }
  c.words = []; c.source = "photo"; c.step = "review"; c.name = "Vở ngày " + ddmm(); c.nameAuto = true;
  return runStream({ mode: "photo" }, [c.file], "AI đang đọc ảnh và lấy từ vựng. Thường mất 15–60 giây.");
}

async function runStream(req, images, status) {
  const c = S.create;
  c.working = true; c.status = status; c.error = ""; c.ctl = new AbortController();
  renderCreate();
  const seen = new Set(c.words.map(w => norm(w.w)));
  try {
    const r = await aiLines(req, {
      images, signal: c.ctl.signal,
      onItem: o => {
        if (S.create !== c) return;
        const it = cleanItem(o); if (!it) return;
        const k = norm(it.w); if (seen.has(k)) return;
        seen.add(k); c.words.push(it); appendRev(c.words.length - 1);
      },
      onMeta: o => {
        if (o.name) setNameIfAuto(c, o.name);
        if (o.error === "no_words") c.error = "Không thấy từ tiếng Anh nào trong ảnh. Thử chụp rõ hơn, đủ sáng và thẳng trang.";
      },
    });
    if (r.truncated) c.error = "AI trả lời bị cắt ngắn. Có thể bấm “Thêm từ” để bổ sung.";
    if (!c.words.length && !c.error) c.error = "AI chưa đưa ra từ nào. Thử lại hoặc đổi cách diễn đạt.";
  } catch (e) {
    const m = aiErrMsg(e); if (m) c.error = m;
  }
  c.working = false; c.ctl = null;
  if (!c.words.length) c.step = "input";
  if (S.create === c && S.view === "create") renderCreate();
}

/* Topic words in batches of 25 (so 100 words never hits a time limit); each batch is told what the list already has. */
async function runBatches(c, kind, total, status) {
  c.working = true; c.error = ""; c.ctl = new AbortController(); c.status = status;
  renderCreate();
  const seen = new Set((c.base || []).concat(c.words).map(w => norm(w.w)));
  const tag = kind === "idioms" ? "idiom" : kind === "advanced" ? "adv" : "";
  let added = 0, truncated = false, rounds = 0;
  try {
    while (added < total && rounds < Math.ceil(total / 25) + 2) {
      rounds++;
      const n = Math.min(25, total - added), before = added;
      if (total > 25) setStatus(c, `${status} Đã có ${added}/${total} từ…`);
      const r = await aiLines({ mode: "topic", topic: c.topic.trim(), level: c.level, count: n, kind, avoid: [...seen].slice(-300) }, {
        signal: c.ctl.signal,
        onItem: o => {
          if (S.create !== c || added >= total) return;
          const it = cleanItem(tag ? Object.assign({}, o, { t: tag }) : o); if (!it) return;
          const k = norm(it.w); if (seen.has(k)) return;
          seen.add(k); c.words.push(it); added++; appendRev(c.words.length - 1);
        },
        onMeta: o => { if (o.name && !c.expand) setNameIfAuto(c, o.name); },
      });
      if (r.truncated) truncated = true;
      if (added === before || S.create !== c || kind === "idioms") break;
    }
  } catch (e) {
    const m = aiErrMsg(e); if (m) c.error = m;
  }
  c.working = false; c.ctl = null;
  if (!c.error && truncated && added < total) c.error = "AI trả lời bị cắt ngắn nên chưa đủ số từ. Có thể thêm tiếp sau.";
  if (!c.words.length && !c.error) c.error = c.expand ? "AI không tìm thêm được từ mới nào. Thử loại từ khác hoặc đổi chủ đề." : "AI chưa đưa ra từ nào. Thử lại hoặc đổi cách diễn đạt.";
  if (!c.words.length) c.step = "input";
  if (S.create === c && S.view === "create") renderCreate();
}

async function runEnrich(idx) {
  const c = S.create;
  idx = idx.filter(i => c.words[i] && c.words[i].w);
  if (!idx.length) { renderCreate(); return; }
  c.working = true; c.status = "AI đang thêm nghĩa và soát chính tả…"; c.error = ""; c.ctl = new AbortController();
  renderCreate();
  let got = 0;
  try {
    for (let s = 0; s < idx.length; s += 60) {
      const chunk = idx.slice(s, s + 60);
      if (idx.length > 60) setStatus(c, `AI đang thêm nghĩa và soát chính tả (${Math.min(s + 60, idx.length)}/${idx.length} từ)…`);
      const byOrig = new Map(); chunk.forEach(i => byOrig.set(norm(c.words[i].w), i));
      let k = 0;
      const r = await aiLines({ mode: "enrich", items: chunk.map(i => ({ w: c.words[i].w, vi: c.words[i].vi || "" })) }, {
        signal: c.ctl.signal,
        onItem: o => {
          if (S.create !== c) return;
          let i = byOrig.get(norm(o.orig || ""));
          if (i == null) i = byOrig.get(norm(o.w));
          if (i == null) i = chunk[k];
          k++;
          const cur = c.words[i], it = cleanItem(o);
          if (!cur || !it) return;
          const changed = norm(it.w) !== norm(cur.w);
          const dup = changed && c.words.some((x, j) => j !== i && norm(x.w) === norm(it.w));
          const next = { w: changed && !dup ? it.w : cur.w, vi: cur.vi || it.vi, ex: it.ex || cur.ex || "", e: it.e || cur.e || "" };
          if (cur.t) next.t = cur.t;
          if (changed && !dup) next.fixed = cur.w;
          c.words[i] = next; replaceRev(i);
        },
        onMeta: o => { if (o.name && !c.editId) setNameIfAuto(c, o.name); },
      });
      got += r.got;
    }
    if (!got) c.error = "AI chưa thêm được nghĩa. Vẫn có thể lưu và chơi, hoặc bấm “AI bổ sung nghĩa” để thử lại.";
  } catch (e) {
    const m = aiErrMsg(e); if (m) c.error = m;
  }
  c.working = false; c.ctl = null;
  if (S.create === c && S.view === "create") renderCreate();
}

async function saveCreate() {
  const c = S.create, words = [], seen = new Set();
  for (const w of c.words) {
    const it = cleanItem(w); if (!it) continue;
    const k = norm(it.w); if (seen.has(k)) continue;
    seen.add(k); words.push(it);
  }
  if (!words.length) { c.error = c.expand ? "Chưa có từ mới nào để thêm." : "Bộ từ cần ít nhất 1 từ tiếng Anh hợp lệ (chỉ chữ cái a–z)."; renderCreate(); return; }
  let added = 0, list = words;
  if (c.expand) {
    const base = c.base || [], have = new Set(base.map(w => norm(w.w)));
    const fresh = words.filter(w => !have.has(norm(w.w)));
    if (!fresh.length) { c.error = "Các từ này đã có trong bộ rồi."; renderCreate(); return; }
    added = fresh.length; list = base.concat(fresh);
  }
  const set = { id: c.editId || newId(), name: (c.name || "").trim() || ("Bộ từ " + ddmm()), words: list.slice(0, 400),
    source: c.source, topic: c.topic || "", level: c.level, createdAt: c.createdAt || Date.now(), example: !!c.example };
  const btn = $("#c-save"); if (btn) btn.disabled = true;
  try {
    await saveSet(set);
    S.setId = set.id; prefs.setId = set.id; savePrefs();
    S.create = null;
    toast(c.expand ? `Đã thêm ${added} từ vào “${set.name}”.` : c.editId ? "Đã lưu thay đổi." : `Đã lưu bộ “${set.name}”. Chọn trò để chơi nhé!`);
    go("home");
  } catch (e) {
    c.error = dbErrMsg(e); renderCreate();
  }
}
async function deleteEditing() {
  const c = S.create;
  try {
    await deleteSet(c.editId);
    if (S.setId === c.editId) { S.setId = null; prefs.setId = null; savePrefs(); }
    S.create = null; toast("Đã xóa bộ từ."); go("sets");
    onData();
  } catch (e) { c.confirmDel = false; c.error = dbErrMsg(e); renderCreate(); }
}

/* =========================================================
   Game runtime + shared pieces + games 1–3 and 5 (Đoán chữ was removed)
   ========================================================= */
let G = null;
const GAMES = {};
const PRAISE = ["Giỏi lắm!", "Chính xác!", "Tuyệt!", "Đúng rồi, hay quá!", "Xuất sắc!"];
const pick = a => a[rand(a.length)];
const T = (s, cls) => [...s].map(c => c === "_" ? '<span class="tile slot"></span>' : `<span class="tile${cls ? " " + cls : ""}">${esc(c)}</span>`).join("");

function leaveGame() {
  if (!G) return;
  const g = G; G = null;
  STUDY.on = false;   // Ôn Tập: ngừng tính giờ học
  for (const f of g.cleanups) { try { f(); } catch {} }
  try { if (TTS.ok) window.speechSynthesis.cancel(); } catch {}
}

function startGame(gid, opts) {
  opts = opts || {};
  const set = opts.set || curSet(), def = GAMES[gid];
  if (!set || !def) return;
  let words = opts.words ? opts.words.filter(w => !def.filter || def.filter(w)).slice(0, opts.max || def.count) : null;
  if (words && words.length < def.min && !set.virtual) {
    const have = new Set(words.map(w => norm(w.w)));
    words = words.concat(pickWords(set, def.count, def.filter, false).filter(w => !have.has(norm(w.w)))).slice(0, Math.max(def.min, words.length));
  }
  if (!words) {
    words = pickWords(set, def.count, def.filter, S.weakOnly);
    if (S.weakOnly && words.length < def.min) {
      words = pickWords(set, def.count, def.filter, false);
      toast("Chưa đủ từ hay sai cho trò này, nên chơi với cả bộ từ.");
    }
  }
  if (words.length < def.min) { toast(def.need); return; }
  go("game", { gameId: gid });
  $("#view").innerHTML = `<div class="game">
    <div class="ghead"><button class="iconbtn" type="button" data-act="home" aria-label="Thoát trò chơi">${ICON.back}</button><h1${(opts.review ? "" : def.name).length > 18 ? ' class="long"' : ""}>${esc(opts.review ? "Ôn tập hôm nay" : def.name)}</h1><span class="hud" id="g-hud"></span></div>
    <div class="bar" aria-hidden="true"><i id="g-bar" style="width:0%"></i></div>
    <div class="stage" id="g-stage"></div>
  </div>`;
  const ctx = {
    def, set, words, items: [], cleanups: [], stage: $("#g-stage"), cur: null, keyFn: null, review: !!opts.review, arena: opts.arena || null,
    hud(t) { const h = $("#g-hud"); if (h) h.textContent = t; },
    progress(i, n) { const b = $("#g-bar"); if (b) b.style.width = Math.round(100 * i / Math.max(1, n)) + "%"; },
    record(w, credit, typed, track) { this.items.push({ w, credit, typed: typed || "", track: track !== false }); if (this.arena) this.arena.onRecord(this, w, credit); },
    later(fn, ms) { const t = setTimeout(() => { if (G === ctx) fn(); }, ms); this.cleanups.push(() => clearTimeout(t)); return t; },
    finish(extra) { finishGame(ctx, extra || {}); },
  };
  const onKey = e => {
    if (G !== ctx || !ctx.keyFn || e.metaKey || e.ctrlKey || e.altKey) return;
    const tag = e.target && e.target.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
    ctx.keyFn(e);
  };
  document.addEventListener("keydown", onKey);
  ctx.cleanups.push(() => document.removeEventListener("keydown", onKey));
  G = ctx;
  studyStart();   // Ôn Tập: bắt đầu tính giờ học của lượt chơi này
  def.start(ctx);
}

function finishGame(ctx, extra) {
  if (G !== ctx) return;
  if (ctx.arena) { studyStep(); const sec = Math.round(STUDY.sec); leaveGame(); ctx.arena.onPlayDone(ctx, extra || {}, sec); return; }   // Ôn Tập: thi đấu
  let score = extra.score;
  if (score == null) {
    const total = ctx.items.length || 1, credits = ctx.items.reduce((a, b) => a + b.credit, 0);
    score = Math.round(20 * credits / total) / 2;
  }
  score = clamp(score, 0, 10);
  // Graded answers update each word's history and its review schedule, in every set that holds the word.
  const today = dayNum(), touched = {}, next = {};
  const statsOf = sid => touched[sid] || (touched[sid] = { words: Object.assign({}, statsFor(sid).words), best: Object.assign({}, statsFor(sid).best) });
  for (const it of ctx.items) {
    if (!it.track) continue;
    const k = norm(it.w.w);
    for (const sid of it.w._sids || [ctx.set.id]) {
      if (sid === "__review" || !S.sets.some(s => s.id === sid)) continue;
      const st = statsOf(sid), prev = st.words[k] || {};
      const rec = srsApply(prev, it.credit, today);
      rec.h = ((prev.h || "") + (it.credit >= 1 ? "1" : "0")).slice(-10);
      st.words[k] = rec; next[k] = rec;
    }
  }
  let isBest = false;
  if (!ctx.set.virtual) {
    const st = statsOf(ctx.set.id);
    isBest = score > 0 && (st.best[ctx.def.id] == null || score > st.best[ctx.def.id]);
    if (isBest) st.best[ctx.def.id] = score;
  }
  for (const sid of Object.keys(touched)) saveStats(sid, { words: touched[sid].words, best: touched[sid].best, updatedAt: Date.now() }).catch(() => {});
  SFX.play(score >= 8 ? "win" : "tap");
  // Ôn Tập: báo lượt chơi về Ôn Tập (số câu, câu đúng ngay lần đầu, thời gian học) để ghi vào báo cáo của con.
  if (IN_ONTAP) { studyStep(); ontapPost({ action: "session", game: ctx.def.id, total: ctx.items.length, correct: ctx.items.filter(it => it.credit >= 1).length, seconds: Math.round(STUDY.sec) }); }
  leaveGame();
  S.result = { gameId: ctx.def.id, score, items: ctx.items, extra, words: ctx.words, isBest, review: ctx.review, next, today };
  S.view = "result"; render();
  updateBadge();
  try { window.scrollTo(0, 0); } catch {}
}

/* ---------- Shared pieces ---------- */
function fb(cls, text) { const f = $("#g-fb"); if (!f) return; f.className = "fb" + (cls ? " " + cls : ""); f.textContent = text || ""; if (text) announce(text); }
function shake(el) { if (!el) return; el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
function clueHtml(w, forceVi) {
  const vi = (prefs.showVi || forceVi) && w.vi;
  if (!w.e && !vi) return "";
  return `<div class="clue">${w.e ? `<span class="emo" aria-hidden="true">${esc(w.e)}</span>` : ""}${vi ? `<span class="vi">${esc(w.vi)}</span>` : ""}</div>`;
}
function speakHtml(w, big) {
  if (!TTS.ok) return "";
  return `<div class="speak">${big ? `<button class="bigspeak" type="button" data-say="w" aria-label="Nghe từ">${ICON.speaker}</button>` : `<button class="btn sm" type="button" data-say="w">${ICON.speaker} Nghe</button>`}
    <button class="btn sm" type="button" data-say="slow">Đọc chậm</button>${w.ex ? '<button class="btn sm" type="button" data-say="ex">Nghe câu</button>' : ""}</div>`;
}
function maskEx(ex, word) {
  const parts = norm(word).split(" ").map(p => p.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  try { return String(ex).replace(new RegExp("\\b" + parts.join("\\s+") + "[a-z]*", "gi"), "____"); } catch { return ex; }
}
function exHtml(w) { return w.ex ? `<div class="ex">${esc(maskEx(w.ex, w.w))}</div>` : ""; }
/* Letter tiles. A phrase (idiom) keeps each word on one line and wraps between words;
   tile size follows the longest word so a single word never has to break. */
function tileWrap(chars, cell) {
  const words = [];
  let cur = [];
  chars.forEach((ch, k) => { if (ch === " ") { if (cur.length) words.push(cur); cur = []; } else cur.push(k); });
  if (cur.length) words.push(cur);
  if (words.length < 2) return `<div class="tiles" style="--n:${Math.max(chars.length, 4)}">${chars.map((ch, k) => cell(ch, k)).join("")}</div>`;
  const n = Math.min(14, Math.max(7, ...words.map(w => w.length)));
  return `<div class="tiles phrase" style="--n:${n}">${words.map(ws => `<span class="tword">${ws.map(k => cell(chars[k], k)).join("")}</span>`).join("")}</div>`;
}
function tilesHtml(word, cls) {
  return tileWrap([...word], ch => isL(ch) ? `<span class="tile${cls ? " " + cls : ""}">${esc(ch)}</span>` : `<span class="tile fixed">${esc(ch)}</span>`);
}
function answerHtml(ph) {
  return `<form class="answer" id="g-form" autocomplete="off"><input class="inp" id="g-in" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="done" placeholder="${esc(ph || "gõ từ ở đây")}" aria-label="Gõ từ"><button class="btn primary" type="submit">Kiểm tra</button></form>`;
}
function align(a, b) {
  const A = [...a], B = [...b], n = A.length, m = B.length, eq = (x, y) => x.toLowerCase() === y.toLowerCase();
  const dp = Array.from({ length: n + 1 }, (_, i) => { const r = new Array(m + 1).fill(0); r[0] = i; return r; });
  for (let j = 0; j <= m; j++) dp[0][j] = j;
  for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++) dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + (eq(A[i - 1], B[j - 1]) ? 0 : 1));
  const ta = [], tb = [];
  let i = n, j = m;
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && dp[i][j] === dp[i - 1][j - 1] + (eq(A[i - 1], B[j - 1]) ? 0 : 1)) { const s = eq(A[i - 1], B[j - 1]); ta.unshift([A[i - 1], s]); tb.unshift([B[j - 1], s]); i--; j--; }
    else if (i > 0 && dp[i][j] === dp[i - 1][j] + 1) { ta.unshift([A[i - 1], false]); i--; }
    else { tb.unshift([B[j - 1], false]); j--; }
  }
  return { ta, tb };
}
function diffHtml(typed, correct) {
  const { ta, tb } = align(typed, correct);
  const t = ta.map(([c, ok]) => ok ? esc(c) : `<s>${esc(c === " " ? "·" : c)}</s>`).join("") || '<span class="muted">(bỏ trống)</span>';
  const c = tb.map(([ch, ok]) => ok ? esc(ch) : `<u>${esc(ch)}</u>`).join("");
  return `<div class="diff"><span class="lab">Em viết</span><span>${t}</span><span class="lab" style="margin-top:6px">Viết đúng</span><span>${c}</span></div>`;
}
const KROWS = ["abcdefg", "hijklmn", "opqrstu", "vwxyz"];
function kbdHtml(cls, lockUsed, extra) {

    const c = cls(k) || "";
    return `<button type="button" data-key="${k}" class="${c}" ${lockUsed && c ? "disabled" : ""} aria-label="${k}">${k}</button>`;
  }).join("")}${ri === 3 && extra ? extra[1] : ""}</div>`).join("");
}
function nextLabel(g, i) { return i + 1 < g.words.length ? "Từ tiếp theo" : "Xem điểm"; }

/* ---------- 1. Nghe – Viết ---------- */
GAMES.bee = {
  id: "bee", name: "Nghe – Viết", en: "Spelling Bee", min: 1, count: 10,

      if (i >= g.words.length) return g.finish();

      $("#g-word").innerHTML = noPrompt ? tilesHtml(w.w) : "";

        $("#g-next").onclick = next;
